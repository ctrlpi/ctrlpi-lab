        <!-- PANE 2: Log Viewer Screen -->
        <!-- PANE: Webhook Viewer -->
        <div id="webhookPane" class="pane">
            <div class="log-toolbar">
                <div class="toolbar-left-group">
                    <span style="font-size:0.85rem;font-weight:600;color:var(--text-main);">Webhook Events</span>
                    <div class="log-icon-actions">
                        <button type="button" class="theme-toggle-btn" title="Refresh webhooks" aria-label="Refresh webhooks" onclick="triggerManualWebhookRefresh()">
                            <svg aria-hidden="true" id="webhookRefreshBtnIcon" viewBox="0 0 24 24">
                                <path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
                            </svg>
                        </button>
                    </div>
                    <div class="log-count-badge">
                        <span id="webhookCount">0</span> events
                    </div>
                </div>
                <div class="toolbar-right-group">
                    <div class="refresh-rate-group">
                        <label for="webhookPollSelect">Poll Rate:</label>
                        <select id="webhookPollSelect" class="refresh-rate-select" onchange="setupWebhookAutoRefresh()">
                            <option value="3000">3s</option>
                            <option value="10000">10s</option>
                            <option value="20000" selected>20s</option>
                            <option value="30000">30s</option>
                            <option value="manual">Manual</option>
                        </select>
                    </div>
                    <div class="config-input-group switch-group" style="border:none; padding:0; background:none;">
                        <label for="webhookAutoScrollToggle" style="margin-right: 6px;">Auto Scroll</label>
                        <label class="toggle-switch">
                            <input type="checkbox" id="webhookAutoScrollToggle" checked>
                            <span class="slider"></span>
                        </label>
                    </div>
                </div>
            </div>
            <div class="webhook-table-wrap">
                <table class="webhook-table">
                    <thead>
                        <tr>
                            <th>Time (UTC)</th>
                            <th>Api-Key</th>
                            <th>Payload</th>
                        </tr>
                    </thead>
                    <tbody id="webhookTbody">
                        <tr><td colspan="3" id="webhookEmpty" style="text-align:center;color:var(--text-muted);padding:48px;">No webhook events yet.</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
