<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ctrlPi Lab</title>
    <meta name="description" content="A local browser dashboard for your ctrlPi setup. Test GPIO and sensor endpoints, watch webhook events, and tail agent logs, with zero dependencies.">
    <!-- Premium Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
        rel="stylesheet">

    <style>
        :root {
            /* Bright (Light) Mode Variables (DEFAULT) */
            --bg-dark: #f0f2f5;
            --bg-deep: #f8fafc;
            --bg-card: rgba(255, 255, 255, 0.75);
            --bg-header: rgba(255, 255, 255, 0.85);
            --bg-sidebar: rgba(255, 255, 255, 0.45);
            --bg-workbench: rgba(255, 255, 255, 0.2);
            --bg-workbench-header: rgba(255, 255, 255, 0.5);
            --bg-input: rgba(255, 255, 255, 0.9);
            --card-shadow: rgba(31, 38, 135, 0.05);

            --border-glow: rgba(16, 185, 129, 0.12);
            --border-muted: rgba(0, 0, 0, 0.08);
            --primary: #10b981;
            --primary-hover: #059669;
            --primary-glow: rgba(16, 185, 129, 0.2);
            --accent: #06b6d4;
            --accent-glow: rgba(6, 182, 212, 0.25);
            --text-main: #0f172a;
            --text-muted: #475569;
            --text-dark: #64748b;
            --success: #059669;
            --danger: #dc2626;
            --warning: #d97706;

            --logo-gradient: linear-gradient(135deg, #064e3b 30%, #10b981 100%);
            --scrollbar-track: rgba(0, 0, 0, 0.03);
            --scrollbar-thumb: rgba(0, 0, 0, 0.1);
            --scrollbar-thumb-hover: rgba(0, 0, 0, 0.2);

            /* Keep terminal console beautifully contrasty */
            --bg-terminal: #09090f;
            --text-terminal: #f3f4f6;
            --border-terminal: rgba(255, 255, 255, 0.08);
        }

        body.dark-mode {
            /* Dark Mode Variables Override */
            --bg-dark: #07060d;
            --bg-deep: #0e0d16;
            --bg-card: rgba(18, 16, 28, 0.7);
            --bg-header: rgba(11, 10, 19, 0.8);
            --bg-sidebar: rgba(14, 13, 24, 0.4);
            --bg-workbench: rgba(5, 4, 10, 0.1);
            --bg-workbench-header: rgba(10, 9, 17, 0.3);
            --bg-input: rgba(0, 0, 0, 0.4);
            --card-shadow: rgba(0, 0, 0, 0.4);

            --border-glow: rgba(52, 211, 153, 0.15);
            --border-muted: rgba(255, 255, 255, 0.06);
            --primary: #10b981;
            --primary-hover: #34d399;
            --primary-glow: rgba(16, 185, 129, 0.35);
            --accent: #06b6d4;
            --accent-glow: rgba(6, 182, 212, 0.2);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --text-dark: #6b7280;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;

            --logo-gradient: linear-gradient(135deg, #fff 30%, #34d399 100%);
            --scrollbar-track: rgba(0, 0, 0, 0.2);
            --scrollbar-thumb: rgba(255, 255, 255, 0.1);
            --scrollbar-thumb-hover: rgba(255, 255, 255, 0.2);

            --bg-terminal: #040308;
            --text-terminal: #f3f4f6;
            --border-terminal: rgba(255, 255, 255, 0.06);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at 10% 20%, #e6fdf5 0%, var(--bg-dark) 90%);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: background 0.3s ease, color 0.3s ease;
        }

        body.dark-mode {
            background: radial-gradient(circle at 10% 20%, #061d15 0%, var(--bg-dark) 90%);
        }

        /* Custom Scrollbar styling */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--scrollbar-track);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--scrollbar-thumb);
            border-radius: 4px;
            border: 2px solid transparent;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--scrollbar-thumb-hover);
        }

        /* Top Header Navbar */
        header {
            min-height: 72px;
            height: auto;
            gap: 16px;
            flex-wrap: wrap;
            background: var(--bg-header);
            border-bottom: 1px solid var(--border-muted);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 24px;
            z-index: 100;
            flex-shrink: 0;
            position: relative;
            transition: background 0.3s ease, border-color 0.3s ease;
        }

        .header-left {
            flex: 1 1 260px;
            min-width: 0;
            display: flex;
            align-items: center;
        }

        /* Header utilities sit beside the tab bar. */
        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }

        .header-icons {
            display: flex;
            align-items: center;
        }

        .logo-group {
            min-width: 0;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-indicator {
            flex-shrink: 0;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            transition: all 0.3s ease;
            cursor: help;
        }

        .logo-indicator.status-online {
            background: var(--success);
            box-shadow: 0 0 10px var(--success);
            animation: pulse-glow-success 2s infinite;
        }

        .logo-indicator.status-offline {
            background: var(--danger);
            box-shadow: 0 0 10px var(--danger);
            animation: pulse-glow-danger 2s infinite;
        }

        .logo-indicator.status-invalid-key {
            background: var(--warning);
            box-shadow: 0 0 10px var(--warning);
            animation: pulse-glow-warning 2s infinite;
        }

        .logo-details {
            min-width: 0;
            flex-wrap: wrap;
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 8px;
        }

        .logo-text {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 800;
            font-size: 1.45rem;
            line-height: 1.1;
            letter-spacing: -0.5px;
            color: #2563eb;
            transition: color 0.3s ease;
        }

        body.dark-mode .logo-text, body.dark-mode .logo-lab {
            color: #3b82f6;
        }

        .logo-lab {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 600;
            font-size: 1.1rem;
            color: #2563eb;
            letter-spacing: -0.2px;
            text-transform: capitalize;
            position: relative;
            top: 3px;
        }

        #logoDeviceName, #logoDeviceModel {
            max-width: 180px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .logo-text, .logo-lab { white-space: nowrap; }
        .header-left > button, .header-icons { flex-shrink: 0; }

        /* Keep connection controls in normal flow so they cannot overlap the title. */
        .api-setup-bar {
            flex: 0 1 410px;
            min-width: 0;
            display: flex;
            align-items: center;
            gap: 0;
            background: transparent;
            border: none;
            padding: 0;
            pointer-events: none;
        }

        .api-setup-inputs {
            width: 100%;
            min-width: 0;
            display: flex;
            align-items: center;
            gap: 20px;
            pointer-events: all;
        }

        .config-input-group {
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 0.8rem;
        }

        .config-input-group label {
            color: var(--text-muted);
            font-weight: 600;
        }

        .config-input-group input {
            background: var(--bg-input);
            border: 1px solid var(--border-muted);
            border-radius: 5px;
            color: var(--text-main);
            padding: 3px 8px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            width: 230px;
            outline: none;
            transition: all 0.25s ease;
        }

        .config-input-group input.port-input {
            width: 60px;
            text-align: center;
        }

        #apiKeyInput {
            width: 100%;
        }

        .config-input-group .port-sep {
            color: var(--text-dark);
            font-family: 'JetBrains Mono', monospace;
            font-size: 1rem;
            margin: 0 -3px;
            user-select: none;
        }

        .config-input-group input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 6px var(--primary-glow);
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            border-radius: 99px;
            font-size: 0.8rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }

        .status-online {
            background: rgba(16, 185, 129, 0.1);
            color: var(--success);
            border: 1px solid rgba(16, 185, 129, 0.25);
        }

        .status-online .status-dot {
            background: var(--success);
            box-shadow: 0 0 8px var(--success);
        }

        .status-invalid-key {
            background: rgba(245, 158, 11, 0.1);
            color: var(--warning);
            border: 1px solid rgba(245, 158, 11, 0.25);
        }

        .status-invalid-key .status-dot {
            background: var(--warning);
            box-shadow: 0 0 8px var(--warning);
        }

        .status-disabled {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
            border: 1px solid rgba(239, 68, 68, 0.25);
        }

        .status-disabled .status-dot {
            background: var(--danger);
            box-shadow: 0 0 8px var(--danger);
        }

        .status-offline {
            background: rgba(107, 114, 128, 0.1);
            color: var(--text-dark);
            border: 1px solid rgba(107, 114, 128, 0.25);
        }

        .status-offline .status-dot {
            background: #6b7280;
        }

        /* Theme Toggle Button Style */
        .theme-toggle-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            width: 30px;
            height: 30px;
            border-radius: 7px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s ease;
            margin-left: 6px;
            outline: none;
        }

        body.dark-mode .theme-toggle-btn {
            background: transparent;
        }

        .theme-toggle-btn:hover {
            color: var(--text-main);
            background: rgba(0, 0, 0, 0.06);
            border-color: var(--primary);
            box-shadow: 0 0 10px var(--primary-glow);
            transform: scale(1.05);
        }

        body.dark-mode .theme-toggle-btn:hover {
            background: rgba(255, 255, 255, 0.06);
        }

        .theme-toggle-btn svg {
            width: 15px;
            height: 15px;
            fill: currentColor;
            transition: transform 0.4s ease;
        }

        /* Icon Visibility Mapping */
        .theme-toggle-btn .sun-icon {
            display: block;
            fill: #fbbf24;
        }

        .theme-toggle-btn .moon-icon {
            display: none;
        }

        body.dark-mode .theme-toggle-btn .sun-icon {
            display: none;
        }

        body.dark-mode .theme-toggle-btn .moon-icon {
            display: block;
        }

        body.dark-mode .theme-toggle-btn svg {
            transform: rotate(360deg);
        }

        /* Scan / Discover button next to API Base input */
        .scan-btn {
            background: transparent;
            border: none;
            color: #2563eb;
            width: 22px;
            height: 22px;
            border-radius: 7px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s ease;
            outline: none;
            flex-shrink: 0;
            margin-left: -3px;
        }

        body.dark-mode .scan-btn {
            background: transparent;
            color: #3b82f6;
        }

        .scan-btn:hover {
            color: #1d4ed8;
            background: rgba(0, 0, 0, 0.06);
            box-shadow: 0 0 10px rgba(37, 99, 235, 0.45);
            transform: scale(1.05);
        }

        body.dark-mode .scan-btn:hover {
            background: rgba(255, 255, 255, 0.06);
            color: #60a5fa;
        }

        .scan-btn svg {
            width: 14px;
            height: 14px;
            fill: currentColor;
            stroke: currentColor;
            stroke-width: 0.6;
        }

        .scan-btn.scanning svg {
            animation: spin 1s linear infinite;
        }

        .toast-popup {
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(-10px);
            background: #1e293b;
            color: #fff;
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
            opacity: 0;
            transition: opacity 0.25s ease, transform 0.25s ease;
            z-index: 9999;
            pointer-events: none;
        }

        .toast-popup.error {
            background: var(--danger);
        }

        .toast-popup.info {
            background: #2563eb;
        }

        .toast-popup.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }




        /* Green only once the handshake actually succeeds over this transport -
           merely clicking/selecting a transport stays uncolored. */


        /* MCP URL shown as read-only text once connected over HTTP */

        /* MCP HTTP address dialog */

        /* Saved Servers Dropdown */
        .servers-dd-wrap {
            position: relative;
            display: flex;
            flex-shrink: 0;
        }
        .servers-dd-wrap #apiHostInput {
            border-radius: 5px 0 0 5px;
            border-right: none;
        }
        .servers-dd-btn {
            background: var(--bg-input);
            border: 1px solid var(--border-muted);
            color: var(--text-muted, #64748b);
            width: 22px;
            height: auto;
            border-radius: 0 5px 5px 0;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s ease;
            outline: none;
            flex-shrink: 0;
        }
        .servers-dd-btn:hover {
            background: var(--border-muted);
            color: var(--text-main);
        }
        body.dark-mode .servers-dd-btn:hover {
            background: #334155;
            color: #e2e8f0;
        }
        .servers-dd-panel {
            display: none;
            position: absolute;
            top: calc(100% + 4px);
            left: 0;
            min-width: 220px;
            background: var(--card-bg, #fff);
            border: 1px solid var(--border, #cbd5e1);
            border-radius: 7px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.12);
            z-index: 999;
            overflow: hidden;
        }
        .servers-dd-panel.open { display: block; }
        body.dark-mode .servers-dd-panel {
            background: #1e293b;
            border-color: #334155;
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
        }
        .servers-dd-item {
            padding: 8px 12px;
            cursor: pointer;
            font-size: 0.82rem;
            font-family: monospace;
            color: var(--text, #1e293b);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            border-bottom: 1px solid var(--border, #e2e8f0);
        }
        .servers-dd-item:last-child { border-bottom: none; }
        .servers-dd-item:hover {
            background: var(--hover-bg, #f1f5f9);
        }
        body.dark-mode .servers-dd-item { color: #e2e8f0; }
        body.dark-mode .servers-dd-item:hover { background: #334155; }
        .servers-dd-empty {
            padding: 10px 12px;
            font-size: 0.8rem;
            color: var(--text-muted, #94a3b8);
            text-align: center;
        }

        /* API Key icon + popup */
        .key-dd-wrap {
            position: relative;
            display: flex;
        }

        .key-icon-btn {
            background: transparent;
            border: none;
            color: #dc2626;
            width: 30px;
            height: 30px;
            border-radius: 7px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s ease;
            margin-left: 2px;
            outline: none;
            flex-shrink: 0;
        }
        body.dark-mode .key-icon-btn {
            background: transparent;
            color: #ef4444;
        }
        .key-icon-btn:hover {
            color: #b91c1c;
            background: rgba(0, 0, 0, 0.06);
            box-shadow: 0 0 10px rgba(220, 38, 38, 0.45);
            transform: scale(1.05);
        }
        body.dark-mode .key-icon-btn:hover {
            background: rgba(255, 255, 255, 0.06);
            color: #f87171;
        }
        .key-icon-btn svg {
            width: 15px;
            height: 15px;
            fill: currentColor;
        }

        .api-key-panel {
            padding: 12px;
            min-width: 240px;
            left: auto;
            right: 0;
        }
        .api-key-panel label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 6px;
        }
        .api-key-panel-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 10px;
        }
        .api-key-panel-actions .btn-action {
            padding: 6px 12px;
            font-size: 0.78rem;
        }

        /* Network Scan Modal */
        .scan-modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .scan-modal-overlay.open {
            display: flex;
        }

        .scan-modal {
            background: var(--bg-deep);
            border: 1px solid var(--border-muted);
            border-radius: 14px;
            width: 440px;
            max-width: 90vw;
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.35);
            overflow: hidden;
        }

        .scan-modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-muted);
        }

        .scan-modal-title {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .scan-modal-close {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            border-radius: 4px;
            transition: all 0.2s ease;
        }

        .scan-modal-close:hover {
            color: var(--text-main);
            background: var(--border-muted);
        }

        .scan-modal-body {
            padding: 18px 20px 20px;
        }

        .scan-status-line {
            font-size: 0.78rem;
            color: var(--text-muted);
            margin-bottom: 10px;
            font-family: 'JetBrains Mono', monospace;
            min-height: 1.2em;
        }

        .scan-progress-bar {
            height: 3px;
            background: var(--border-muted);
            border-radius: 2px;
            margin-bottom: 16px;
            overflow: hidden;
        }

        .scan-progress-fill {
            height: 100%;
            background: var(--primary);
            border-radius: 2px;
            width: 0%;
        }

        .scan-results-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 240px;
            overflow-y: auto;
        }

        .scan-result-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            border: 1px solid var(--border-muted);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            background: var(--bg-card);
        }

        .scan-result-item:hover {
            border-color: var(--primary);
            background: var(--primary-glow);
            box-shadow: 0 0 10px var(--primary-glow);
        }

        .scan-result-url {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.82rem;
            color: var(--text-main);
            font-weight: 500;
        }

        .scan-result-badge {
            font-size: 0.7rem;
            color: var(--success);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .scan-empty-state {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.83rem;
            padding: 22px 0 8px;
        }

        /* Navigation Links */
        nav {
            display: flex;
            align-items: center;
            gap: 2px;
            background: rgba(0, 0, 0, 0.03);
            padding: 4px;
            border-radius: 12px;
            border: 1px solid var(--border-muted);
        }

        body.dark-mode nav {
            background: rgba(0, 0, 0, 0.2);
        }

        .tab-link {
            text-decoration: none;
            color: #707f94;
            /* Distinct unselected slate-grey */
            padding: 8px 10px;
            font-size: 0.9rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        body.dark-mode .tab-link {
            color: #64748b;
            /* Muted grey for dark mode unselected tabs */
        }

        .tab-link:hover {
            color: var(--text-main);
            background: transparent;
        }

        body.dark-mode .tab-link:hover {
            color: #fff;
            background: transparent;
        }

        .tab-link.active {
            color: var(--accent) !important;
            background: transparent !important;
            box-shadow: none !important;
        }

        /* Main Screen Layout Container */
        main {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        .pane {
            display: none;
            opacity: 0;
            width: 100%;
            height: 100%;
            transition: opacity 0.3s ease;
            overflow: hidden;
        }

        .pane.active {
            display: grid;
            opacity: 1;
        }

        /* Page 1: OpenAPI Tester Panel & MCP Panel Layout */
        #testerPane {
            grid-template-columns: 320px 1fr;
        }

        /* Left Side Sidebar */
        .sidebar {
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border-muted);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: background 0.3s ease, border-color 0.3s ease;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--border-muted);
        }

        .sidebar-title {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--text-main);
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .search-box {
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-box input {
            width: 100%;
            background: var(--bg-input);
            border: 1px solid var(--border-muted);
            padding: 10px 14px 10px 38px;
            border-radius: 8px;
            color: var(--text-main);
            outline: none;
            font-size: 0.85rem;
            transition: all 0.25s ease;
        }

        .search-box input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 8px var(--primary-glow);
        }

        .search-box svg {
            position: absolute;
            left: 12px;
            width: 16px;
            height: 16px;
            fill: var(--text-dark);
        }

        /* Endpoint list navigation */
        .endpoint-list {
            flex-grow: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* Info panels (Welcome / MCP Setup / API CURL) */
        .info-panel {
            display: none;
            flex-direction: column;
            flex: 1;
            overflow-y: auto;
            padding: 32px 40px;
            gap: 28px;
        }

        .info-panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-muted);
        }

        .info-panel-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .info-panel-close {
            background: none;
            border: 1px solid var(--border-muted);
            border-radius: 6px;
            padding: 4px 12px;
            cursor: pointer;
            color: var(--text-muted);
            font-size: 0.8rem;
        }

        .info-panel-close:hover { color: var(--text-main); border-color: var(--primary); }

        .info-section { display: flex; flex-direction: column; gap: 10px; }

        .info-section h3 {
            font-size: 0.88rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--primary);
        }

        .info-section p, .info-section li {
            font-size: 0.88rem;
            color: var(--text-muted);
            line-height: 1.6;
        }

        .info-section ul { padding-left: 18px; display: flex; flex-direction: column; gap: 4px; }

        .info-section code {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.82rem;
            background: var(--bg-input);
            border: 1px solid var(--border-muted);
            border-radius: 4px;
            padding: 1px 6px;
            color: var(--text-main);
        }

        .info-code-block {
            background: var(--bg-terminal);
            color: var(--text-terminal);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            line-height: 1.6;
            border-radius: 8px;
            padding: 14px 18px;
            overflow-x: auto;
            white-space: pre;
            border: 1px solid var(--border-terminal);
        }

        .info-code-label {
            font-size: 0.74rem;
            font-weight: 600;
            color: var(--text-dark);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin-bottom: 4px;
        }

        .info-cards {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 12px;
        }

        .info-card {
            background: var(--bg-card);
            border: 1px solid var(--border-muted);
            border-radius: 10px;
            padding: 14px 16px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .info-card-title {
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .info-card-desc {
            font-size: 0.78rem;
            color: var(--text-muted);
            line-height: 1.5;
        }

        .pinout-link {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            border-radius: 8px;
            border: 1px solid transparent;
            color: var(--text-muted);
            font-size: 0.82rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .pinout-link:hover {
            background: rgba(0, 0, 0, 0.02);
            border-color: var(--border-muted);
            color: var(--text-main);
            transform: translateX(3px);
        }

        body.dark-mode .pinout-link:hover {
            background: rgba(255, 255, 255, 0.03);
        }

        .pinout-link.active {
            background: rgba(16, 185, 129, 0.08);
            border-color: rgba(16, 185, 129, 0.3);
            color: var(--text-main);
        }

        .endpoint-category-title {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-dark);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 14px;
            margin-bottom: 4px;
        }

        .endpoint-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 14px;
            border-radius: 8px;
            background: transparent;
            border: 1px solid transparent;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .endpoint-item:hover {
            background: rgba(0, 0, 0, 0.02);
            border-color: var(--border-muted);
            transform: translateX(3px);
        }

        body.dark-mode .endpoint-item:hover {
            background: rgba(255, 255, 255, 0.03);
        }

        .endpoint-item.active {
            background: rgba(16, 185, 129, 0.08);
            border-color: rgba(16, 185, 129, 0.3);
            box-shadow: inset 0 0 8px rgba(16, 185, 129, 0.05);
        }

        body.dark-mode .endpoint-item.active {
            background: rgba(52, 211, 153, 0.08);
            border-color: rgba(52, 211, 153, 0.3);
        }

        .method-badge {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.65rem;
            font-weight: 700;
            padding: 2px 5px;
            border-radius: 4px;
            min-width: 42px;
            text-align: center;
            letter-spacing: 0.3px;
        }

        .method-badge.get {
            background: #2563eb;
            color: white;
            border: 1px solid transparent;
        }

        body.dark-mode .method-badge.get {
            background: #3b82f6;
            color: white;
            border: 1px solid transparent;
        }

        .method-badge.post {
            background: #059669;
            color: white;
            border: 1px solid transparent;
        }

        body.dark-mode .method-badge.post {
            background: #10b981;
            color: white;
            border: 1px solid transparent;
        }

        .endpoint-path-text {
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-family: 'JetBrains Mono', monospace;
        }

        .endpoint-item.active .endpoint-path-text {
            color: var(--text-main);
            font-weight: 600;
        }

        body.dark-mode .endpoint-item.active .endpoint-path-text {
            color: #fff;
        }

        /* Right Side Workbench */
        .workbench {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: var(--bg-workbench);
            transition: background 0.3s ease;
        }

        .workbench-header {
            padding: 24px 32px;
            border-bottom: 1px solid var(--border-muted);
            background: var(--bg-workbench-header);
            transition: background 0.3s ease, border-color 0.3s ease;
        }

        .workbench-path-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 8px;
            width: 100%;
        }

        .workbench-path-details {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-grow: 1;
            min-width: 0;
        }

        .workbench-path-row .method-badge {
            font-size: 0.85rem;
            padding: 4px 10px;
            border-radius: 6px;
        }

        .workbench-path-text {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.15rem;
            font-weight: 600;
            color: var(--text-main);
        }

        body.dark-mode .workbench-path-text {
            color: #fff;
        }

        .workbench-description {
            font-size: 0.88rem;
            color: var(--text-muted);
            line-height: 1.5;
            max-width: 900px;
        }

        /* Workbench Main Area */
        .workbench-body {
            flex-grow: 1;
            overflow-y: auto;
            padding: 32px;
            display: flex;
            gap: 32px;
            width: 100%;
            box-sizing: border-box;
            transition: all 0.4s ease;
        }

        .workbench-section-title {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 700;
            font-size: 1rem;
            color: var(--text-main);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        body.dark-mode .workbench-section-title {
            color: #fff;
        }

        .workbench-section-title svg {
            width: 18px;
            height: 18px;
            fill: var(--primary-hover);
        }

        .glass-card {
            background: var(--bg-card);
            border: 1px solid var(--border-muted);
            border-radius: 16px;
            padding: 24px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: var(--card-shadow);
            display: flex;
            flex-direction: column;
            position: relative;
            transition: background 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
            overflow: hidden;
        }

        .glass-card.request-card {
            flex: 1.1;
            min-width: 350px;
            transition: flex 0.45s cubic-bezier(0.25, 0.8, 0.25, 1), border-color 0.3s ease, box-shadow 0.3s ease;
            border-top: 3px solid var(--primary);
        }

        .glass-card.response-card {
            flex: 1;
            min-width: 350px;
            transition: flex 0.45s cubic-bezier(0.25, 0.8, 0.25, 1), border-color 0.3s ease, box-shadow 0.3s ease;
            border-top: 3px solid var(--accent);
        }

        /* Dynamic Width States based on active panel focus */
        .workbench-body.focus-request .glass-card.request-card {
            flex: 2 1 0%;
        }

        .workbench-body.focus-request .glass-card.response-card {
            flex: 1 1 0%;
        }

        .workbench-body.focus-response .glass-card.request-card {
            flex: 1 1 0%;
        }

        .workbench-body.focus-response .glass-card.response-card {
            flex: 2 1 0%;
        }


        #mcpPane .workbench-body.focus-request .glass-card.response-card {
            flex: 1 1 0%;
        }

        /* Parameters Form styling */
        .params-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
            flex-grow: 1;
            overflow-y: auto;
            padding-right: 8px;
        }

        .parameter-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .param-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .param-label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .param-required {
            color: var(--danger);
            font-size: 0.75rem;
            font-weight: bold;
        }

        .param-type {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            color: var(--text-dark);
            background: rgba(0, 0, 0, 0.03);
            padding: 0 6px;
            border-radius: 4px;
        }

        body.dark-mode .param-type {
            background: rgba(255, 255, 255, 0.03);
        }

        .param-desc {
            font-size: 0.8rem;
            color: var(--text-muted);
            line-height: 1.4;
        }

        /* Input Types styling */
        .param-input-wrapper {
            position: relative;
        }

        .param-input {
            width: 100%;
            background: var(--bg-input);
            border: 1px solid var(--border-muted);
            border-radius: 8px;
            color: var(--text-main);
            padding: 10px 14px;
            font-size: 0.88rem;
            outline: none;
            transition: all 0.25s ease;
        }

        .param-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 8px var(--primary-glow);
        }

        .param-input.invalid {
            border-color: #e53e3e;
            box-shadow: 0 0 6px rgba(229, 62, 62, 0.4);
        }

        .gpio-range-note {
            color: #e53e3e;
            font-size: 0.76rem;
            display: none;
            text-align: right;
            margin-top: 3px;
        }

        .param-select {
            appearance: none;
            -webkit-appearance: none;
            background-repeat: no-repeat;
            background-position: right 10px center;
            background-size: 16px;
            padding-right: 36px;
            background-image: url("data:image/svg+xml;utf8,<svg fill='gray' height='24' viewBox='0 0 24 24' width='24' xmlns='http://www.w3.org/2000/svg'><path d='M7 10l5 5 5-5z'/><path d='M0 0h24v24H0z' fill='none'/></svg>");
        }

        body.dark-mode .param-select {
            background-image: url("data:image/svg+xml;utf8,<svg fill='white' height='24' viewBox='0 0 24 24' width='24' xmlns='http://www.w3.org/2000/svg'><path d='M7 10l5 5 5-5z'/><path d='M0 0h24v24H0z' fill='none'/></svg>");
        }

        /* Helper buttons / Quick options */
        .quick-options-row {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 6px;
        }

        .quick-btn {
            background: rgba(0, 0, 0, 0.02);
            border: 1px solid var(--border-muted);
            color: var(--text-muted);
            font-size: 0.75rem;
            padding: 3px 8px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: 'JetBrains Mono', monospace;
        }

        body.dark-mode .quick-btn {
            background: rgba(255, 255, 255, 0.03);
        }

        .quick-btn:hover {
            background: rgba(52, 211, 153, 0.15);
            border-color: var(--primary);
            color: #fff;
        }

        /* Switch / Toggle slider */
        .switch-group {
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
            background: transparent;
            padding: 8px 0;
            border-radius: 0;
            border: none;
        }

        body.dark-mode .switch-group {
            background: transparent;
        }

        .switch-group .param-meta {
            flex-direction: column;
            align-items: flex-start;
            gap: 2px;
        }

        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
            flex-shrink: 0;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.08);
            transition: .3s;
            border-radius: 24px;
            border: 1px solid var(--border-muted);
        }

        body.dark-mode .slider {
            background-color: rgba(255, 255, 255, 0.1);
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 3px;
            bottom: 3px;
            background-color: var(--text-muted);
            transition: .3s;
            border-radius: 50%;
        }

        .toggle-switch input:checked+.slider {
            background-color: var(--primary);
        }

        .toggle-switch input:checked+.slider:before {
            transform: translateX(20px);
            background-color: #fff;
        }

        /* Live URL preview box */
        .url-preview-box {
            background: var(--bg-input);
            border: 1px solid var(--border-muted);
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 24px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.82rem;
            line-height: 1.4;
            display: flex;
            align-items: center;
            gap: 10px;
            word-break: break-all;
        }

        .url-preview-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.5px;
            background: var(--border-glow);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: var(--primary-hover);
            padding: 0 6px;
            border-radius: 4px;
            flex-shrink: 0;
        }

        body.dark-mode .url-preview-label {
            border-color: rgba(52, 211, 153, 0.4);
            color: #6ee7b7;
        }

        .url-preview-value {
            color: var(--text-muted);
        }

        /* Send Request Button */
        .send-btn {
            background: var(--primary);
            border: none;
            color: #fff;
            padding: 10px 20px;
            border-radius: 8px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.25s ease;
            box-shadow: 0 4px 14px var(--primary-glow);
        }

        .send-btn:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(52, 211, 153, 0.4);
        }

        .send-btn:active {
            transform: translateY(0);
        }

        .send-btn:disabled {
            background: rgba(52, 211, 153, 0.3);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* JSON Textarea Editor Tab */
        .body-tab-header {
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
            border-bottom: 1px solid var(--border-muted);
            padding-bottom: 6px;
        }

        .body-tab-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 0.8rem;
            font-weight: 600;
            padding: 4px 10px;
            cursor: pointer;
            position: relative;
            transition: color 0.2s;
        }

        .body-tab-btn.active {
            color: var(--text-main);
        }

        body.dark-mode .body-tab-btn.active {
            color: #fff;
        }

        .body-tab-btn.active::after {
            content: '';
            position: absolute;
            bottom: -7px;
            left: 0;
            width: 100%;
            height: 2px;
            background: var(--primary);
        }

        .raw-json-editor {
            width: 100%;
            height: 200px;
            background: var(--bg-input);
            border: 1px solid var(--border-muted);
            border-radius: 8px;
            color: #059669;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            padding: 14px;
            outline: none;
            resize: vertical;
            line-height: 1.5;
        }

        body.dark-mode .raw-json-editor {
            color: #34d399;
        }

        .raw-json-editor:focus {
            border-color: var(--primary);
            box-shadow: 0 0 8px var(--primary-glow);
        }

        /* Response Panel layout */
        .response-meta-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            background: var(--bg-input);
            border: 1px solid var(--border-muted);
            padding: 10px 16px;
            border-radius: 10px;
        }

        .resp-meta-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .resp-meta-val {
            font-weight: 600;
            color: var(--text-main);
            font-family: 'JetBrains Mono', monospace;
        }

        .resp-status-badge {
            font-weight: 700;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-family: 'JetBrains Mono', monospace;
        }

        .resp-status-2xx {
            background: rgba(16, 185, 129, 0.15);
            color: var(--success);
            border: 1px solid rgba(16, 185, 129, 0.25);
        }

        .resp-status-4xx,
        .resp-status-5xx {
            background: rgba(239, 68, 68, 0.15);
            color: var(--danger);
            border: 1px solid rgba(239, 68, 68, 0.25);
        }

        /* Pretty JSON colorization classes */
        .json-viewer-container {
            flex-grow: 1;
            position: relative;
            background: var(--bg-terminal);
            border: 1px solid var(--border-terminal);
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-height: 250px;
            transition: background 0.3s ease, border-color 0.3s ease;
        }

        .json-viewer-header {
            height: 38px;
            background: rgba(0, 0, 0, 0.2);
            border-bottom: 1px solid var(--border-terminal);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .copy-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 0.75rem;
            transition: color 0.2s;
        }

        .copy-btn:hover {
            color: #fff;
        }

        .copy-btn svg {
            width: 14px;
            height: 14px;
            fill: currentColor;
        }

        .json-content {
            flex-grow: 1;
            padding: 16px;
            overflow: auto;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-all;
            color: var(--text-terminal);
        }

        /* Highlight classes */
        .json-key {
            color: #c084fc;
            font-weight: 600;
        }

        .json-string {
            color: #34d399;
        }

        .json-number {
            color: #f59e0b;
        }

        .json-boolean {
            color: #60a5fa;
        }

        .json-null {
            color: #9ca3af;
        }

        /* Empty state response panel */
        .response-empty-state {
            flex-grow: 1;
            display: flex;
            flex-direction: column;

            justify-content: center;
            text-align: center;
            color: var(--text-dark);

            padding: 40px;

            height: 60px;
            fill: rgba(0, 0, 0, 0.02);

            border-radius: 8px;
            overflow: hidden;
        }

        .headers-toggle-btn {
            width: 100%;
            background: rgba(0, 0, 0, 0.01);
            border: none;
            color: var(--text-muted);
            font-size: 0.8rem;
            font-weight: 600;
            padding: 10px 16px;
            text-align: left;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        body.dark-mode .headers-toggle-btn {
            background: rgba(255, 255, 255, 0.01);
        }

        .headers-toggle-btn:hover {
            background: rgba(0, 0, 0, 0.02);
            color: var(--text-main);
        }

        body.dark-mode .headers-toggle-btn:hover {
            background: rgba(255, 255, 255, 0.02);
            color: #fff;
        }

        .headers-toggle-btn svg {
            width: 14px;
            height: 14px;
            fill: currentColor;
            transition: transform 0.2s;
        }

        .headers-toggle-btn.open svg {
            transform: rotate(180deg);
        }

        .headers-content {
            display: none;
            background: rgba(0, 0, 0, 0.03);
            border-top: 1px solid var(--border-muted);
            padding: 12px 16px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.78rem;
            color: var(--text-muted);
            max-height: 150px;
            overflow-y: auto;
        }

        body.dark-mode .headers-content {
            background: rgba(0, 0, 0, 0.2);
        }

        /* Page 2: Log Viewer Pane Layout */
        #logPane, #webhookPane {
            flex-direction: column;
            padding: 32px;
            gap: 24px;
        }

        .webhook-table-wrap {
            background: var(--bg-card);
            border: 1px solid var(--border-muted);
            border-radius: 16px;
            overflow-y: auto;
            box-shadow: var(--card-shadow);
            flex: 1;
        }

        .webhook-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.82rem;
        }

        .webhook-table thead tr {
            background: rgba(99, 102, 241, 0.08);
        }

        .webhook-table th {
            padding: 12px 16px;
            text-align: left;
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-muted);
        }

        .webhook-table td {
            padding: 10px 16px;
            border-top: 1px solid var(--border-muted);
            vertical-align: top;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.78rem;
        }

        .webhook-table tbody tr:hover td {
            background: rgba(99, 102, 241, 0.04);
        }

        .webhook-ts-cell  { color: #7ec8e3; white-space: nowrap; }
        .webhook-key-cell { color: #10b981; white-space: nowrap; }
        .webhook-payload-cell { color: var(--text-main); word-break: break-all; }

        /* Log Panel Toolbar */
        .log-toolbar {
            background: var(--bg-card);
            border: 1px solid var(--border-muted);
            padding: 16px 24px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: var(--card-shadow);
            transition: background 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .toolbar-left-group {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .log-icon-actions {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .log-icon-actions button {
            margin-left: 0;
        }

        .log-icon-actions button:focus-visible {
            outline: 2px solid currentColor;
            outline-offset: 2px;
        }

        .log-search {
            width: 250px;
        }

        .log-search input {
            width: 100%;
            background: var(--bg-input);
            border: 1px solid var(--border-muted);
            border-radius: 8px;
            padding: 8px 12px 8px 34px;
            color: var(--text-main);
            font-size: 0.85rem;
            outline: none;
            transition: all 0.25s ease;
        }

        .log-search input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 8px var(--accent-glow);
        }

        .log-search svg {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            width: 14px;
            height: 14px;
            fill: var(--text-dark);
        }

        .toolbar-right-group {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        /* Auto-scroll toggle and count */
        .log-count-badge {
            background: var(--bg-input);
            border: 1px solid var(--border-muted);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .log-count-badge span {
            font-family: 'JetBrains Mono', monospace;
            color: var(--accent);
            font-weight: 600;
        }

        .refresh-rate-group {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .refresh-rate-select {
            background: var(--bg-input);
            border: 1px solid var(--border-muted);
            color: var(--text-main);
            padding: 6px 10px;
            border-radius: 6px;
            outline: none;
            cursor: pointer;
            font-family: inherit;
        }

        .refresh-rate-select:focus {
            border-color: var(--accent);
        }

        .btn-action {
            background: var(--bg-input);
            border: 1px solid var(--border-muted);
            color: var(--text-main);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .btn-action:hover {
            background: rgba(0, 0, 0, 0.04);
            border-color: rgba(0, 0, 0, 0.15);
        }

        body.dark-mode .btn-action:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .btn-action.btn-clear:hover {
            background: rgba(239, 68, 68, 0.1);
            border-color: rgba(239, 68, 68, 0.3);
            color: #ef4444;
        }

        .btn-action.btn-accent {
            background: var(--accent);
            border-color: transparent;
            color: #fff;
            box-shadow: 0 4px 10px var(--accent-glow);
        }

        .btn-action.btn-accent:hover {
            background: #0891b2;
            transform: translateY(-1px);
        }

        .btn-action.btn-accent:active {
            transform: translateY(0);
        }

        .btn-action svg {
            width: 14px;
            height: 14px;
            fill: currentColor;
        }

        .btn-action.btn-danger {
            background: var(--danger);
            border-color: transparent;
            color: #fff;
            box-shadow: 0 4px 10px rgba(220, 38, 38, 0.35);
        }

        .btn-action.btn-danger:hover {
            background: #b91c1c;
            transform: translateY(-1px);
        }

        .btn-action.btn-danger:active {
            transform: translateY(0);
        }

        /* Danger Zone - API key change panel on the /config/update workbench */
        .danger-zone {
            margin-top: 22px;
            padding: 16px 18px;
            border: 1px solid rgba(220, 38, 38, 0.35);
            border-radius: 12px;
            background: rgba(220, 38, 38, 0.05);
        }

        body.dark-mode .danger-zone {
            background: rgba(239, 68, 68, 0.07);
            border-color: rgba(239, 68, 68, 0.3);
        }

        .danger-zone-title {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 0 0 6px;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--danger);
        }

        .danger-zone-title svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        .danger-zone-row {
            display: flex;
            gap: 10px;
        }

        .danger-zone-row .param-input {
            flex: 1;
        }

        .danger-zone-result {
            margin-top: 10px;
            font-size: 0.78rem;
            font-family: 'JetBrains Mono', monospace;
        }

        .danger-zone-result.success { color: var(--success); }
        .danger-zone-result.error { color: var(--danger); }

        /* Terminal Console Container */
        .terminal-container {
            flex-grow: 1;
            background: var(--bg-terminal);
            border: 1px solid var(--border-terminal);
            border-radius: 16px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4), inset 0 0 30px rgba(52, 211, 153, 0.01);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            transition: background 0.3s ease, border-color 0.3s ease;
        }

        .terminal-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, var(--primary), var(--accent));
        }

        .terminal-header {
            height: 40px;
            background: rgba(0, 0, 0, 0.2);
            border-bottom: 1px solid var(--border-terminal);
            display: flex;
            align-items: center;
            padding: 0 20px;
            justify-content: space-between;
        }

        .terminal-dots {
            display: flex;
            gap: 6px;
        }

        .terminal-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        .td-red {
            background: #ff5f56;
        }

        .td-yellow {
            background: #ffbd2e;
        }

        .td-green {
            background: #27c93f;
        }

        .terminal-title {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.78rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .terminal-screen {
            flex-grow: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            line-height: 1.6;
            color: var(--text-terminal);
        }

        #logTerminalScreen {
            gap: 0;
            line-height: 1.35;
        }

        /* Log Line Color styles */
        .log-line {
            white-space: pre-wrap;
            word-break: break-all;
            padding: 0 6px;
            border-radius: 4px;
            transition: background 0.15s;
        }

        .log-line:hover {
            background: rgba(255, 255, 255, 0.02);
        }

        .log-tag-api {
            color: #d8b4fe;
            font-weight: bold;
        }

        .log-tag-gpio {
            color: #6ee7b7;
            font-weight: bold;
        }


        .log-tag-webhook {
            color: #fb923c;
            font-weight: bold;
        }

        .log-time {
            color: var(--text-dark);
            margin-right: 8px;
            font-style: italic;
        }

        /* Empty logs design */
        .logs-empty-state {
            margin: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-dark);
            gap: 12px;
            text-align: center;
        }

        .logs-empty-state svg {
            width: 48px;
            height: 48px;
            stroke: rgba(255, 255, 255, 0.05);
            stroke-width: 1.5;
            fill: none;
        }

        /* Keyframes */
        @keyframes pulse-glow-success {
            0% {
                transform: scale(0.95);
                opacity: 0.8;
                box-shadow: 0 0 6px var(--success);
            }

            50% {
                transform: scale(1.05);
                opacity: 1;
                box-shadow: 0 0 14px var(--success);
            }

            100% {
                transform: scale(0.95);
                opacity: 0.8;
                box-shadow: 0 0 6px var(--success);
            }
        }

        @keyframes pulse-glow-danger {
            0% {
                transform: scale(0.95);
                opacity: 0.8;
                box-shadow: 0 0 6px var(--danger);
            }

            50% {
                transform: scale(1.05);
                opacity: 1;
                box-shadow: 0 0 14px var(--danger);
            }

            100% {
                transform: scale(0.95);
                opacity: 0.8;
                box-shadow: 0 0 6px var(--danger);
            }
        }

        @keyframes pulse-glow-warning {
            0% {
                transform: scale(0.95);
                opacity: 0.8;
                box-shadow: 0 0 6px var(--warning);
            }

            50% {
                transform: scale(1.05);
                opacity: 1;
                box-shadow: 0 0 14px var(--warning);
            }

            100% {
                transform: scale(0.95);
                opacity: 0.8;
                box-shadow: 0 0 6px var(--warning);
            }
        }

        .rotate-anim {
            animation: spin 0.8s ease-in-out;
        }

        @keyframes spin {
            100% {
                transform: rotate(360deg);
            }
        }

        /* Header wraps as groups; its background encloses every row. */
        .agent-connection { display: inline-flex; align-items: center; gap: 8px; min-width: 0; max-width: 100%; }
        #logoDeviceModel, #agentAddress { font-family: 'Inter', sans-serif; font-size: 0.95rem; font-weight: 500; line-height: 1.4; color: var(--text-muted); position: relative; top: 1px; }
        #logoDeviceModel:empty { display: none; }
        #logoDeviceModel { flex-shrink: 1; }
        .agent-picker { display: inline-flex; align-items: center; position: relative; gap: 5px; min-width: 0; }
        .agent-picker-btn { display: inline-flex; align-items: center; gap: 6px; border: 0; background: transparent; color: var(--text-muted); padding: 5px 0; cursor: pointer; font: 0.75rem 'JetBrains Mono', monospace; min-width: 0; }
        #agentAddress { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #9ca3af; }
        .agent-picker-btn:hover { color: var(--primary); }
        .agent-picker .theme-toggle-btn { color: var(--primary); margin: 0; width: 26px; }
        .agent-picker #savedServersPanel { width: max-content; max-width: min(620px, calc(100vw - 48px)); max-height: 300px; overflow-y: auto; }
        .servers-dd-item { display: block; width: 100%; text-align: left; background: transparent; border: 0; white-space: normal; overflow-wrap: anywhere; line-height: 1.5; }
        .header-right nav { white-space: nowrap; }
        .add-agent-dialog { width: min(420px, calc(100vw - 32px)); margin: auto; padding: 24px; border: 1px solid var(--border-muted); border-radius: 16px; background: var(--bg-deep); color: var(--text-main); box-shadow: 0 20px 80px #0004; }
        .add-agent-dialog::backdrop { background: #0007; backdrop-filter: blur(3px); }
        .add-agent-dialog h2 { font-size: 1.2rem; margin-bottom: 8px; }
        .add-agent-dialog p { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 16px; }
        .add-agent-dialog label { display: block; font-size: 0.8rem; font-weight: 600; margin: 14px 0 6px; }
        .add-agent-dialog input { width: 100%; padding: 10px; border: 1px solid var(--border-muted); border-radius: 7px; background: var(--bg-input); color: var(--text-main); font: inherit; }
        #addAgentError { color: var(--danger); margin-top: 12px; }
        @media (max-width: 600px) {
            header { padding: 12px; gap: 12px; }
            .header-left { flex-basis: 100%; }
            .header-right { width: 100%; justify-content: space-between; }
            .tab-link { padding: 8px; gap: 5px; }
        }

        /* Responsive */
        @media (max-width: 1440px) {
            .log-count-badge {
                display: none;
            }
        }

        @media (max-width: 1024px) {
            #testerPane {
                grid-template-columns: 260px 1fr;
            }

            .workbench-body {
                grid-template-columns: 1fr;
            }

            .log-icon-actions {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .log-icon-actions button {
            margin-left: 0;
        }

        .log-icon-actions button:focus-visible {
            outline: 2px solid currentColor;
            outline-offset: 2px;
        }

        .log-search {
                display: none;
            }
        }
    </style>
</head>

        // Toggle Theme logic (Default is Bright Mode / Light Mode)
        function initTheme() {
            const savedTheme = localStorage.getItem('ctrlpi-theme');
            if (savedTheme === 'dark') {
                document.body.classList.add('dark-mode');
            } else {
                document.body.classList.remove('dark-mode');
            }
        }

        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            localStorage.setItem('ctrlpi-theme', isDark ? 'dark' : 'light');
            checkApiStatus(); // Re-render badges with correct theme variables

        // Hidden dev helper: rebuilds the server's cached merged HTML from pages/
        // on disk, then reloads the browser so page edits show up immediately.
        async function reloadPageCache() {
            try {
                await fetch('/api/reload-cache', { method: 'POST' });
            } catch (e) {}
            location.reload();

        // Dynamically fetch current config state to populate forms
        let _cachedPiConfig = null;

        async function fetchPiConfig() {
            try {
                const url = getApiUrl();
                const apiKey = document.getElementById('apiKeyInput').value;
                const response = await piApiFetch(`${url}/config/read`, { headers: { 'Api-Key': apiKey } });
                if (!response.ok) return;
                _cachedPiConfig = await response.json();
                // Show the board model (e.g. "Raspberry Pi 4 Model B", "Pico 2 W") next to the name
                const modelEl = document.getElementById('logoDeviceModel');
                const model = (_cachedPiConfig.agent || {}).platform || '';
                if (model) _agentModels.set(url, model);
                if (modelEl && url === getApiUrl()) modelEl.textContent = model ? ` - ${model}` : '';
                renderServersDropdown(_savedServersCache);
            } catch (e) {
                console.warn('Could not fetch Pi config', e);
            }
        }

        async function fetchAndPopulateConfigFields(prefix) {
            try {
                const cfg = _cachedPiConfig;
                if (!cfg) return;
                // /config/read is grouped; the form fields carry the ungrouped (root)
                // names the agent also accepts, so flatten the groups back out to match.
                const flat = { ...cfg };
                const n = cfg.notifications || {};
                if (n.webhook !== undefined) flat.webhook_url = n.webhook;
                if (n.webhook_key !== undefined) flat.webhook_key = n.webhook_key;
                Object.assign(flat, cfg.settings || {}, cfg.bridges || {});
                for (const [key, value] of Object.entries(flat)) {
                    const el = document.getElementById(`${prefix}${key}`);
                    if (el) {
                        if (el.type === 'checkbox') {
                            el.checked = value;
                        } else if (el.tagName === 'SELECT') {
                            el.value = value ? 'true' : 'false';
                        } else {
                            el.value = value || '';
                        }
                    }
                }
            } catch (e) {
                console.warn("Could not pre-fill config form", e);
            }
        }

        async function fetchWebhooks() {
            const webhookUrl = ((_cachedPiConfig || {}).notifications || {}).webhook || '';
            if (!webhookUrl.toLowerCase().includes('ctrlpi.com')) return;
            const dataUrl = 'https://ctrlpi.com/webhook/data';
            const list = document.getElementById('webhookList');
            const empty = document.getElementById('webhookEmpty');
            try {
                const response = await fetch(`/api/proxy/url?url=${encodeURIComponent(dataUrl)}`);
                if (!response.ok) throw new Error(response.statusText);
                let data = await response.json();
                if (data.text) { try { data = JSON.parse(data.text); } catch (_) {} }
                const events = Array.isArray(data) ? data : (data.entries || data.events || data.data || []);
                document.getElementById('webhookCount').textContent = events.length;
                const tbody = document.getElementById('webhookTbody');
                if (!events.length) {
                    tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;color:var(--text-muted);padding:48px;">No webhook events yet.</td></tr>';
                    return;
                }
                const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
                // Oldest first so newest ends up at bottom
                tbody.innerHTML = [...events].reverse().map(evt => {
                    const ts = esc(evt.ts || evt.timestamp || '');
                    const key = esc(evt.api_key || '-');
                    const payload = esc(JSON.stringify(evt.body || evt));
                    return `<tr>
                        <td class="webhook-ts-cell">${ts}</td>
                        <td class="webhook-key-cell">${key}</td>
                        <td class="webhook-payload-cell">${payload}</td>
                    </tr>`;
                }).join('');
                const wrap = document.querySelector('.webhook-table-wrap');
                if (wrap && document.getElementById('webhookAutoScrollToggle').checked) {
                    wrap.scrollTop = wrap.scrollHeight;
                }
            } catch (e) {
                document.getElementById('webhookTbody').innerHTML =
                    `<tr><td colspan="3" style="text-align:center;color:#f87171;padding:48px;">Failed to load webhook data: ${e.message}</td></tr>`;
            }
        }

        let _localNetworkPrefix = '';

        // Every startup prefers localhost, then the first responding LAN agent.
        async function autoConfigureDefaults() {
            document.getElementById('apiHostInput').value = 'http://localhost';
            try {
                const response = await fetch('/api/default-config');
                if (response.ok) {
                    const cfg = await response.json();
                    _localNetworkPrefix = cfg.local_network_prefix || '';
                    document.getElementById('apiPortInput').value = cfg.api_port || '8314';
                    document.getElementById('apiKeyInput').value = cfg.api_key || '';
                    const reloadBtn = document.getElementById('pageCacheReloadBtn');
                    if (reloadBtn) reloadBtn.style.display = cfg.dev_mode ? '' : 'none';
                }
            } catch (e) {
                console.warn('Could not fetch server defaults:', e);
            }
            await loadSavedServers();
            applySavedKeyForCurrentHost();
            updateApiKeyTooltip();
            updateSendButtonState();
            try {
                const response = await piApiFetch(`${getApiUrl()}/hello`, {
                    signal: AbortSignal.timeout(2000)
                });
                if (response.ok) {
                    setAgentConnection(getApiUrl());
                    return;
                }
            } catch { /* No local agent: discover the LAN. */ }
            // Resume initialization at the first response while discovery keeps running.
            await new Promise(resolve => { runNetworkScan(true, resolve).finally(resolve); });
        }

        function refreshKeyPanelContext(tabId) {
            const label = document.getElementById('apiKeyPanelLabel');
            const agentInput = document.getElementById('apiKeyInput');
            if (label) label.textContent = 'API Key';
            if (agentInput) agentInput.style.display = '';
            updateApiKeyTooltip();
        }

        // Navigation tab switching
        function switchTab(tabId) {
            document.querySelectorAll('.tab-link').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.pane').forEach(p => {
                p.classList.remove('active');
                p.style.display = 'none';
            });

            const link = document.querySelector(`[data-tab="${tabId}"]`);
            if (link) link.classList.add('active');

            const targetPane = document.getElementById(tabId);
            if (targetPane) {
                targetPane.style.display = (tabId === 'testerPane' || tabId === 'mcpPane') ? 'grid' : 'flex';
                // Small buffer to allow layout to settle before fading opacity
                setTimeout(() => {
                    targetPane.classList.add('active');
                }, 10);
            }

            // The webhook viewer always hits ctrlpi.com directly - the agent URL/port
            // bar isn't relevant there.
            refreshKeyPanelContext(tabId);

        // Render Endpoint List items in the left side
        function renderEndpointsSidebar() {

            const sensors = endpoints.filter(e => e.path.startsWith('/sensor'))
                .sort((a, b) => (a.path.startsWith('/sensor/config') ? 1 : 0) - (b.path.startsWith('/sensor/config') ? 1 : 0));

        // Search endpoints in list
        function filterEndpoints() {
            const q = document.getElementById('endpointSearchInput').value.toLowerCase();
            endpoints.forEach(e => {
                const el = document.getElementById(`sidebar-item-${e.id}`);
                if (!el) return;

                const matchesPath = e.path.toLowerCase().includes(q);
                const matchesDesc = e.description.toLowerCase().includes(q);
