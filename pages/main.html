        // Endpoint Selection & details populating
        // autoRun: if true (default), auto-execute GET endpoints with no params
        function selectEndpoint(id, autoRun = true) {
            closePinout();
            selectedEndpointId = id;
            document.querySelectorAll('.endpoint-item').forEach(item => item.classList.remove('active'));
            const selectedItem = document.getElementById(`sidebar-item-${id}`);
            if (selectedItem) selectedItem.classList.add('active');

            const ep = endpoints.find(e => e.id === id);
            if (!ep) return;

            // Populate Workbench Header
            const badge = document.getElementById('selectedMethodBadge');
            badge.className = `method-badge ${ep.method.toLowerCase()}`;
            badge.innerText = ep.method;
            document.getElementById('selectedPathText').innerText = ep.path;
            document.getElementById('selectedDescriptionText').innerText = ep.description;

            // Clear response panel & refocus to request
            document.getElementById('responseEmptyState').style.display = 'flex';
            document.getElementById('responseDetailsWrapper').style.display = 'none';
            const workbenchBody = document.querySelector('#testerPane .workbench-body');
            if (workbenchBody) {
                workbenchBody.classList.add('focus-request');
                workbenchBody.classList.remove('focus-response');
            }

            // Render Form inputs
            renderFormInputs(ep);
            updateLiveUrlPreview();

            // Auto-execute GET endpoints with no path params and no body
            const hasPathParams = ep.pathParams && ep.pathParams.length > 0;
            const hasBody = ep.bodyType;
            if (autoRun && ep.method === 'GET' && !hasPathParams && !hasBody) {
                sendApiRequest();
            }

            if (ep.id === 'config_gpio') {
                onGpioTypeChange('output');
                const pinInput = document.getElementById('param-path-gpio');
                if (pinInput && pinInput.value) fetchAndPopulateGpioConfig(pinInput.value);
                validateConfigGpio(pinInput ? pinInput.value : '');
                updateConfigGpioQuickOptions();
            }

            // If this is the config POST endpoint, fetch current state to populate defaults
            if (ep.id === 'set_config') {
                fetchAndPopulateConfigFields('param-body-');
            }

            // Sensor endpoints: offer a picker of the currently-configured sensors
            if (ep.id === 'read_sensor' || ep.id === 'config_sensor') {
                updateSensorQuickOptions(ep.id);
            }

            if (ep.id === 'read_gpio') {
                const v = document.getElementById('param-path-name_or_gpio');
                validateReadWriteGpio(v ? v.value : '');
                updateReadGpioQuickOptions();
            } else if (ep.id === 'write_gpio') {
                const v = document.getElementById('param-path-name_or_gpio');
                validateReadWriteGpio(v ? v.value : '');
                updateWriteGpioQuickOptions();
            } else if (ep.id !== 'config_gpio') {
                updateSendButtonState();
            }
        }

        function pinButtonLabel(gpio, info) {
            return info.name ? `${info.name} (${gpio})` : gpio;
        }

        async function updateWriteGpioQuickOptions() {
            try {
                const url = getApiUrl();
                const apiKey = document.getElementById('apiKeyInput').value;
                const resp = await piApiFetch(`${url}/config/read`, { headers: { 'Api-Key': apiKey } });
                if (!resp.ok) return;
                const data = await resp.json();
                const pins = data.gpios || {};
                const container = document.getElementById('quick-options-write_gpio-name_or_gpio');
                if (container) {
                    container.innerHTML = Object.entries(pins)
                        .filter(([, info]) => info.type !== 'vcc' && info.type !== 'gnd' && info.type !== 'input')
                        .map(([gpio, info]) => {
                            const label = pinButtonLabel(gpio, info);
                            return `<button class="quick-btn" onclick="setInputValue('name_or_gpio', '${gpio}')">${label}</button>`;
                        }).join('');
                }
            } catch (e) {
                console.warn("Could not dynamically load write GPIO quick options", e);
            }
        }

        // Returns true if the write should proceed. If the target pin is currently an
        // input, prompts the user to convert it to an output (write auto-converts it);
        // returns false only when the user explicitly cancels.
        async function confirmWriteToInput() {
            try {
                const target = (document.getElementById('param-path-name_or_gpio')?.value || '').trim();
                if (!target) return true;
                const url = getApiUrl();
                const apiKey = document.getElementById('apiKeyInput').value;
                const resp = await piApiFetch(`${url}/config/read`, { headers: { 'Api-Key': apiKey } });
                if (!resp.ok) return true; // can't determine type - let the request proceed
                const data = await resp.json();
                const pins = data.gpios || {};
                let gpioNum = target;
                let entry = pins[target];
                if (!entry) {
                    const found = Object.entries(pins).find(([, info]) => info.name === target);
                    if (found) { gpioNum = found[0]; entry = found[1]; }
                }
                if (!entry || entry.type !== 'input') return true; // not an input - proceed
                return confirm(`GPIO ${gpioNum} is currently configured as an INPUT pin.\n\nWriting to it will convert it to an OUTPUT. Convert and continue?`);
            } catch (e) {
                console.warn('Could not verify pin type before write', e);
                return true;
            }
        }

        // Populate the sensor-name picker (read_sensor / config_sensor) with the agent's
        // currently-configured sensors, mirroring the GPIO quick options.
        async function updateSensorQuickOptions(endpointId) {
            try {
                const url = getApiUrl();
                const apiKey = document.getElementById('apiKeyInput').value;
                const resp = await piApiFetch(`${url}/config/read`, { headers: { 'Api-Key': apiKey } });
                if (!resp.ok) return;
                const data = await resp.json();
                const sensors = data.sensors || {};
                const container = document.getElementById(`quick-options-${endpointId}-name`);
                if (!container) return;
                container.innerHTML = Object.keys(sensors).map(name => {
                    const esc = name.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
                    if (endpointId === 'read_sensor') {
                        return `<button class="quick-btn" onclick="setInputValue('name', '${esc}'); sendApiRequest(); event.stopPropagation();">${name}</button>`;
                    }
                    return `<button class="quick-btn" onclick="pickSensorConfig('${esc}')">${name}</button>`;
                }).join('');
            } catch (e) {
                console.warn('Could not load sensor quick options', e);
            }
        }

        // Pick an existing sensor into the config form: set the name and prefill the
        // file/script body from its current config (like fetchAndPopulateGpioConfig for pins).
        async function pickSensorConfig(name) {
            setInputValue('name', name);
            try {
                const url = getApiUrl();
                const apiKey = document.getElementById('apiKeyInput').value;
                const resp = await piApiFetch(`${url}/config/read`, { headers: { 'Api-Key': apiKey } });
                if (!resp.ok) return;
                const data = await resp.json();
                const s = (data.sensors || {})[name] || {};
                const fileEl = document.getElementById('param-body-file');
                const scriptEl = document.getElementById('param-body-script');
                if (fileEl) fileEl.value = s.file || '';
                if (scriptEl) scriptEl.value = s.script || '';
                updateLiveUrlPreview();
            } catch (e) {
                console.warn('Could not prefill sensor config', e);
            }
        }

        function validateGpioParam(value, inputEl, noteEl, btnEl, namesAllowed) {
            const trimmed = (value || '').trim();
            const n = parseInt(trimmed, 10);
            const isNumeric = trimmed !== '' && String(n) === trimmed;
            let valid;
            if (!trimmed)          valid = true;
            else if (isNumeric)    valid = n >= 2 && n <= 27;
            else                   valid = !!namesAllowed;
            const showError = !!trimmed && !valid;
            if (inputEl) inputEl.classList.toggle('invalid', showError);
            if (noteEl)  noteEl.style.display = showError ? 'block' : 'none';
            if (btnEl)   btnEl.disabled = showError || !document.getElementById('apiHostInput').value.trim();
        }

        function validateConfigGpio(value) {
            validateGpioParam(value,
                document.getElementById('param-path-gpio'),
                document.getElementById('gpio-range-note'),
                document.getElementById('sendRequestBtn'),
                false);
        }

        function validateReadWriteGpio(value) {
            validateGpioParam(value,
                document.getElementById('param-path-name_or_gpio'),
                document.getElementById('gpio-range-note'),
                document.getElementById('sendRequestBtn'),
                true);
        }

        // Draw dynamic form fields for parameter variables
        function renderFormInputs(ep) {
            const form = document.getElementById('paramsFormContainer');
            form.innerHTML = '';

            let hasInputs = false;

            // 1. Path Params
            if (ep.pathParams && ep.pathParams.length > 0) {
                hasInputs = true;
                ep.pathParams.forEach(param => {
                    const group = document.createElement('div');
                    group.className = 'parameter-group';

                    let quickHtml = '';
                    if (param.quickOptions) {
                        quickHtml = `<div class="quick-options-row" id="quick-options-${ep.id}-${param.name}">`;
                        param.quickOptions.forEach(opt => {
                            const afterSet = ep.autoSend ? ' sendApiRequest(); event.stopPropagation();' : '';
                            quickHtml += `<button class="quick-btn" onclick="setInputValue('${param.name}', '${opt}');${afterSet}">${opt}</button>`;
                        });
                        quickHtml += `</div>`;
                    }

                    group.innerHTML = `
                        <div class="param-meta">
                            <span class="param-label">
                                ${param.name}
                                ${param.required ? '<span class="param-required">*</span>' : ''}
                            </span>
                            <span class="param-type">Path Parameter (${param.type})</span>
                        </div>
                        <p class="param-desc">${param.description}</p>
                        <div class="param-input-wrapper">
                            <input type="text" id="param-path-${param.name}" class="param-input" placeholder="${param.placeholder || ''}" value="${param.default !== undefined ? param.default : (param.quickOptions && param.quickOptions[0] !== undefined ? param.quickOptions[0] : '')}" oninput="updateLiveUrlPreview();${ep.id === 'config_gpio' && param.name === 'gpio' ? 'fetchAndPopulateGpioConfig(this.value); validateConfigGpio(this.value);' : (ep.id === 'read_gpio' || ep.id === 'write_gpio') && param.name === 'name_or_gpio' ? 'validateReadWriteGpio(this.value);' : ''}">
                        </div>
                        ${(ep.id === 'config_gpio' && param.name === 'gpio') || ((ep.id === 'read_gpio' || ep.id === 'write_gpio') && param.name === 'name_or_gpio') ? '<p class="gpio-range-note" id="gpio-range-note">Interesting choice. Unfortunately, reality caps out at 2–27.</p>' : ''}
                        ${quickHtml}
                    `;
                    form.appendChild(group);
                });
            }

            // 2. Query Params
            if (ep.queryParams && ep.queryParams.length > 0) {
                hasInputs = true;
                ep.queryParams.forEach(param => {
                    const group = document.createElement('div');
                    group.className = 'parameter-group';

                    group.innerHTML = `
                        <div class="param-meta">
                            <span class="param-label">
                                ${param.name}
                                ${param.required ? '<span class="param-required">*</span>' : ''}
                            </span>
                            <span class="param-type">Query Parameter (${param.type})</span>
                        </div>
                        <p class="param-desc">${param.description}</p>
                        <div class="param-input-wrapper">
                            <input type="${param.type === 'number' ? 'number' : 'text'}" step="any" id="param-query-${param.name}" class="param-input" placeholder="${param.placeholder || ''}" oninput="updateLiveUrlPreview()">
                        </div>
                    `;
                    form.appendChild(group);
                });
            }

            // 3. Body Request JSON Fields
            if (ep.bodyFields && ep.bodyFields.length > 0) {
                hasInputs = true;

                // Card body builder tab
                const bodyHeader = document.createElement('div');
                bodyHeader.className = 'body-tab-header';
                bodyHeader.innerHTML = `
                    <button class="body-tab-btn active" id="btnTabForm" onclick="switchBodyTab('form')">Payload Builder</button>
                    <button class="body-tab-btn" id="btnTabRaw" onclick="switchBodyTab('raw')">Raw JSON</button>
                `;
                form.appendChild(bodyHeader);

                // Container for forms builder fields
                const formSection = document.createElement('div');
                formSection.id = 'bodyFieldsFormSection';
                formSection.style.display = 'flex';
                formSection.style.flexDirection = 'column';
                formSection.style.gap = '16px';

                ep.bodyFields.forEach(field => {
                    const group = document.createElement('div');
                    group.id = `param-body-group-${field.name}`;

                    if (field.type === 'boolean') {
                        group.className = 'parameter-group switch-group';
                        group.innerHTML = `
                            <div class="param-meta">
                                <span class="param-label">${field.name}</span>
                                <p class="param-desc" style="margin-top: 2px;">${field.description}</p>
                            </div>
                            <label class="toggle-switch">
                                <input type="checkbox" id="param-body-${field.name}" ${field.default === true ? 'checked' : ''}>
                                <span class="slider"></span>
                            </label>
                        `;
                    } else if (field.type === 'select') {
                        group.className = 'parameter-group';
                        let optionsHtml = '';
                        field.options.forEach(opt => {
                            const val = typeof opt === 'object' ? opt.value : opt;
                            const lbl = typeof opt === 'object' ? opt.label : opt;
                            optionsHtml += `<option value="${val}" ${val === field.default ? 'selected' : ''}>${lbl}</option>`;
                        });

                        group.innerHTML = `
                            <div class="param-meta">
                                <span class="param-label">${field.label || field.name}</span>
                                <span class="param-type">JSON attribute</span>
                            </div>
                            <p class="param-desc">${field.description}</p>
                            <div class="param-input-wrapper">
                                <select id="param-body-${field.name}" class="param-input param-select"${field.onchange ? ` onchange="${field.onchange}"` : ''}>
                                    ${optionsHtml}
                                </select>
                            </div>
                        `;
                    } else if (field.inline) {
                        // Inline input: description on the left, input on the right, no type label
                        group.className = 'parameter-group';
                        group.innerHTML = `
                            <div class="param-meta">
                                <span class="param-label">
                                    ${field.name}
                                    ${field.required ? '<span class="param-required">*</span>' : ''}

                                </div>

                    } else {

            // Raw-only body (no form fields, just a JSON textarea)
            if (ep.bodyType === 'raw' && !(ep.bodyFields && ep.bodyFields.length > 0)) {

                if (ep.rawNote) {

                        <input type="text" id="dangerZoneNewApiKey" class="param-input" placeholder="New API key">

                    <div class="danger-zone-result" id="dangerZoneResult"></div>

        // Click helper buttons to change inputs
        function setInputValue(paramName, value) {
            const input = document.getElementById(`param-path-${paramName}`);
            if (input) {
                input.value = value;
                updateLiveUrlPreview();
                if (selectedEndpointId === 'config_gpio' && paramName === 'gpio') {
                    fetchAndPopulateGpioConfig(value);
                }
            }
        }

        function verifyRawJson() {
            const textarea = document.getElementById('bodyFieldsRawSection');
            const result = document.getElementById('verifyJsonResult');
            if (!textarea || !result) return;
            try {
                JSON.parse(textarea.value.trim() || '{}');
                result.textContent = '✓ Valid JSON';
                result.style.color = 'var(--success, #22c55e)';
            } catch (e) {
                result.textContent = '✗ ' + e.message;
                result.style.color = '#ef4444';
            }
        }

        async function populateCurrentConfig() {
            const textarea = document.getElementById('bodyFieldsRawSection');
            const result = document.getElementById('verifyJsonResult');
            if (!textarea) return;
            try {
                const url = getApiUrl();
                const apiKey = document.getElementById('apiKeyInput').value;
                const resp = await piApiFetch(`${url}/config/read`, { headers: { 'Api-Key': apiKey } });
                if (!resp.ok) throw new Error(`Server returned ${resp.status}`);
                const data = await resp.json();
                ['ip', 'platform', 'os'].forEach(k => delete data[k]);
                textarea.value = JSON.stringify(data, null, 4);
                if (result) { result.textContent = '✓ Loaded'; result.style.color = 'var(--success, #22c55e)'; }
            } catch (e) {
                if (result) { result.textContent = '✗ ' + e.message; result.style.color = '#ef4444'; }
            }
        }

        function onGpioTypeChange(value) {
            const isSignal = value === 'output' || value === 'input';
            const isClear = value === 'remove';
            const nameGroup = document.getElementById('param-body-group-name');
            if (nameGroup) nameGroup.style.display = isClear ? 'none' : '';
            document.getElementById('param-body-group-pullup').style.display = value === 'input' ? '' : 'none';
            const initGroup = document.getElementById('param-body-group-init');
            if (initGroup) initGroup.style.display = isSignal ? '' : 'none';
            const maxGroup = document.getElementById('param-body-group-max');
            if (maxGroup) maxGroup.style.display = value === 'output' ? '' : 'none';
            const revGroup = document.getElementById('param-body-group-reversed');
            if (revGroup) revGroup.style.display = isSignal ? '' : 'none';
            const watchedGroup = document.getElementById('param-body-group-watched');
            if (watchedGroup) watchedGroup.style.display = isSignal ? '' : 'none';
        }

        let _gpioConfigDebounce = null;
        async function fetchAndPopulateGpioConfig(nameOrGpio) {
            if (!nameOrGpio || !nameOrGpio.trim()) return;
            clearTimeout(_gpioConfigDebounce);
            _gpioConfigDebounce = setTimeout(async () => {
                try {
                    const url = getApiUrl();
                    const apiKey = document.getElementById('apiKeyInput').value;
                    const response = await piApiFetch(`${url}/gpio/read/${encodeURIComponent(nameOrGpio.trim())}`, {
                        headers: { 'Api-Key': apiKey }
                    });
                    if (!response.ok) return;
                    const data = await response.json();
                    const pin = data.gpio !== undefined ? data : data[Object.keys(data)[0]];
                    if (!pin) return;
                    const el = (id) => document.getElementById(`param-body-${id}`);
                    const defaults = { type: 'output', init: 'none', pullup: 'up' };
                    // Text fields: always update, clear if absent
                    if (el('name')) el('name').value = pin.name || '';
                    if (el('max')) el('max').value = pin.max != null ? pin.max : '';
                    // Select fields: set to pin value or reset to default
                    ['type', 'init', 'pullup'].forEach(key => {
                        const s = el(key);
                        if (!s) return;
                        const val = pin[key] != null ? String(pin[key]) : defaults[key];
                        if (val && [...s.options].some(o => o.value === val)) s.value = val;
                    });
                    // Boolean fields
                    if (el('reversed')) el('reversed').checked = !!pin.reversed;
                    if (el('watched')) el('watched').checked = !!pin.watched;
                    onGpioTypeChange(pin.type || 'output');
                } catch (_) {}
            }, 400);
        }

        // Toggle request body view type
        function switchBodyTab(type) {
            const btnForm = document.getElementById('btnTabForm');
            const btnRaw = document.getElementById('btnTabRaw');
            const secForm = document.getElementById('bodyFieldsFormSection');
            const secRaw = document.getElementById('bodyFieldsRawSection');

            if (type === 'form') {
                btnForm.classList.add('active');
                btnRaw.classList.remove('active');
                secForm.style.display = 'flex';
                secRaw.style.display = 'none';

                // Sync Raw edits back to Form (if valid)
                try {
                    const currentRaw = JSON.parse(secRaw.value);
                    const ep = endpoints.find(e => e.id === selectedEndpointId);
                    if (ep && ep.bodyFields) {
                        ep.bodyFields.forEach(f => {
                            const val = currentRaw[f.name];
                            if (val !== undefined) {
                                const input = document.getElementById(`param-body-${f.name}`);
                                if (input) {
                                    if (f.type === 'boolean') {
                                        input.checked = !!val;
                                    } else {
                                        input.value = val;
                                    }
                                }
                            }
                        });
                    }
                } catch (e) { }
            } else {
                btnForm.classList.remove('active');
                btnRaw.classList.add('active');
                secForm.style.display = 'none';
                secRaw.style.display = 'block';

                // Sync Form fields to Raw JSON text
                const payload = getFormBodyData();
                secRaw.value = JSON.stringify(payload, null, 4);
            }
        }

        // Capture all form visual field values into raw objects
        function getFormBodyData() {
            const ep = endpoints.find(e => e.id === selectedEndpointId);
            if (!ep || !ep.bodyFields) return null;

            const payload = {};
            ep.bodyFields.forEach(field => {
                const input = document.getElementById(`param-body-${field.name}`);
                if (!input) return;
                if (field.conditionalOn) {
                    const dep = document.getElementById(`param-body-${field.conditionalOn.field}`);
                    if (!dep) return;
                    const match = field.conditionalOn.values
                        ? field.conditionalOn.values.includes(dep.value)
                        : dep.value === field.conditionalOn.value;
                    if (!match) return;
                }

                let val = null;
                if (field.type === 'boolean') {
                    val = input.checked;
                } else if (field.type === 'number') {
                    val = input.value === '' ? null : Number(input.value);
                } else {
                    val = input.value;
                    // Auto-convert string digits or null/flips into appropriate types if desired
                    if (val === 'null') val = null;
                    else if (val === '1' && field.name === 'value') val = 1;
                    else if (val === '0' && field.name === 'value') val = 0;
                }

                if (val !== null && (val !== '' || field.sendEmpty)) {
                    payload[field.name] = val;
                }
            });
            return payload;
        }

        // Construct dynamic request URL preview
        function updateLiveUrlPreview() {
            const baseUrl = getApiUrl();
            const ep = endpoints.find(e => e.id === selectedEndpointId);
            if (!ep) return;

            let path = ep.path;

            // Replace path variables
            if (ep.pathParams) {
                ep.pathParams.forEach(param => {
                    const input = document.getElementById(`param-path-${param.name}`);
                    const val = input ? input.value.trim() : '';
                    path = path.replace(`{${param.name}}`, val ? encodeURIComponent(val) : `{${param.name}}`);
                });
            }

            // Append query variables
            const queries = [];
            if (ep.queryParams) {
                ep.queryParams.forEach(param => {
                    const input = document.getElementById(`param-query-${param.name}`);
                    if (input && input.value.trim() !== '') {
                        queries.push(`${param.name}=${encodeURIComponent(input.value.trim())}`);
                    }
                });
            }

            const queryStr = queries.length > 0 ? `?${queries.join('&')}` : '';
            document.getElementById('selectedPathText').innerText = `${baseUrl}${path}${queryStr}`;
        }

        // Trigger request to main API server
        async function sendApiRequest() {
            if (!document.getElementById('apiHostInput').value.trim()) return;
            updateLiveUrlPreview(); // ensure URL reflects current host/port inputs before sending
            const btn = document.getElementById('sendRequestBtn');
            const targetUrl = document.getElementById('selectedPathText').innerText;
            const key = document.getElementById('apiKeyInput').value.trim();
            const ep = endpoints.find(e => e.id === selectedEndpointId);
            if (!ep) return;

            // Writing to a pin currently configured as input would silently convert it
            // to an output server-side - warn and let the user confirm (or cancel) first.
            if (ep.id === 'write_gpio' && !(await confirmWriteToInput())) return;

            // Shift width focus to the results card immediately upon execution
            const bodyContainer = document.querySelector('#testerPane .workbench-body');
            if (bodyContainer) {
                bodyContainer.classList.remove('focus-request');
                bodyContainer.classList.add('focus-response');
            }

            // Loading state
            btn.disabled = true;
            btn.innerHTML = `<svg class="rotate-anim" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor"><circle cx="12" cy="12" r="10" stroke-width="2" stroke-dasharray="20 40"/></svg> Executing...`;

            // Prepare Request body
            let body = null;
            if (ep.method === 'POST') {
                const btnRaw = document.getElementById('btnTabRaw');
                const isRawTab = (btnRaw && btnRaw.classList.contains('active')) || (!btnRaw && document.getElementById('bodyFieldsRawSection'));

                if (isRawTab) {
                    const rawVal = document.getElementById('bodyFieldsRawSection').value.trim();
                    try {
                        body = rawVal ? JSON.stringify(JSON.parse(rawVal)) : null;
                    } catch (e) {
                        alert("Invalid JSON format in Raw body editor!");
                        btn.disabled = false;
                        btn.innerHTML = `<svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg> Send`;
                        return;
                    }
                } else {
                    const formData = getFormBodyData();
                    body = formData ? JSON.stringify(formData) : null;
                }
            }

            const startTime = performance.now();

            try {
                const headers = {
                    'Content-Type': 'application/json',
                    'Api-Key': key
                };

                const response = await piApiFetch(targetUrl, {
                    method: ep.method,
                    headers: headers,
                    body: body
                });

                const endTime = performance.now();
                const latency = Math.round(endTime - startTime);

                // Read body
                let respData;
                const contentType = response.headers.get("content-type");
                if (contentType && contentType.includes("application/json")) {
                    respData = await response.json();
                } else {
                    respData = { message: await response.text() };
                }

                displayResponse(response.status, response.statusText, latency, respData, response.headers);
                if (selectedEndpointId === 'config_gpio' && response.ok) {
                    updateConfigGpioQuickOptions();
                }
            } catch (err) {
                const endTime = performance.now();
                const latency = Math.round(endTime - startTime);
                displayResponse(0, "Network Error / Offline", latency, {
                    error: "Failed to connect to API server.",
                    details: err.message,
                    suggestion: `Ensure your API server is running, and api is enabled, if not start it using python main.py --enable-api in your shell.`
                }, null);
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg> Send`;
            }
        }

        // Render response results
        function displayResponse(statusCode, statusText, latency, data, headers) {
            document.getElementById('responseEmptyState').style.display = 'none';
            document.getElementById('responseDetailsWrapper').style.display = 'flex';

            // Status Badge coloring
            const badge = document.getElementById('responseStatusBadge');
            badge.innerText = `${statusCode} ${statusText}`;
            if (statusCode >= 200 && statusCode < 300) {
                badge.className = 'resp-status-badge resp-status-2xx';
            } else {
                badge.className = 'resp-status-badge resp-status-4xx';
            }

            // Latency display
            document.getElementById('responseLatencyVal').innerText = `${latency} ms`;

            // JSON Color highlighting
            lastResponseData = data;
            const codeBlock = document.getElementById('jsonResponseView');
            codeBlock.innerHTML = syntaxHighlightJson(data);

            // Headers rendering
            const headersBox = document.getElementById('responseHeadersContent');
            headersBox.innerHTML = '';
            if (headers) {
                let hHtml = '<table style="width:100%; border-collapse:collapse; text-align:left;">';
                for (let [k, v] of headers.entries()) {
                    hHtml += `<tr style="border-bottom:1px solid var(--border-muted);"><td style="padding:4px 8px; color:var(--text-main); font-weight:600;">${k}</td><td style="padding:4px 8px; word-break:break-all;">${v}</td></tr>`;
                }
                hHtml += '</table>';
                headersBox.innerHTML = hHtml;
            } else {
                headersBox.innerHTML = '<span style="font-style:italic;">No headers received</span>';
            }
        }

        // HTML JSON Syntax colorizer
        function syntaxHighlightJson(json) {
            if (typeof json !== 'string') {
                json = JSON.stringify(json, undefined, 4);
            }
            json = json.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            return json.replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+-]?\d+)?)/g, function (match) {
                let cls = 'json-number';
                if (/^"/.test(match)) {
                    if (/:$/.test(match)) {
                        cls = 'json-key';
                    } else {
                        cls = 'json-string';
                    }
                } else if (/true|false/.test(match)) {
                    cls = 'json-boolean';
                } else if (/null/.test(match)) {
                    cls = 'json-null';
                }
                return `<span class="${cls}">${match}</span>`;
            });
        }

        // Copy JSON response utility
        function copyResponseToClipboard() {
            if (!lastResponseData) return;
            const str = JSON.stringify(lastResponseData, null, 4);
            navigator.clipboard.writeText(str).then(() => {
                const btn = document.querySelector('.copy-btn');
                const origHtml = btn.innerHTML;
                btn.innerHTML = '✓ Copied!';
                setTimeout(() => btn.innerHTML = origHtml, 1500);
            });
        }

        // Toggle Headers panel dropdown
        function toggleHeadersDropdown() {
            const btn = document.querySelector('.headers-toggle-btn');
            const content = document.getElementById('responseHeadersContent');
            isHeadersOpen = !isHeadersOpen;
            if (isHeadersOpen) {
                btn.classList.add('open');

        // Perform a single-shot check to verify if the API Key is valid
        async function verifyApiKeyDirectly(url, key) {
            try {
                const response = await piApiFetch(`${url}/config/read`, {
                    method: 'GET',
                    headers: { 'Api-Key': key }
                });
                if (response.status === 200) {
                    isApiKeyValid = true;
                    return 200;
                } else if (response.status === 403) {
                    isApiKeyValid = false;
                    return 403;
                } else if (response.status === 503) {
                    isApiKeyValid = 'disabled';
                    return 503;
                }
                isApiKeyValid = false;
                return response.status;
            } catch (e) {
                isApiKeyValid = false;
                return 'offline';
            }
        }

        // Verify API is online and key works
        async function checkApiStatus() {
            const url = getApiUrl();
            const key = document.getElementById('apiKeyInput').value.trim();
            const indicator = document.getElementById('logoIndicator');
            if (!indicator) return;

            try {
                // Ping the unauthenticated /hello endpoint (never logged, completely silent)
                const healthResponse = await piApiFetch(`${url}/hello`);

                if (healthResponse.status === 200) {
                    let deviceName = '';
                    try {
                        const helloData = await healthResponse.json();
                        deviceName = helloData.name || helloData.device_name || '';
                        document.getElementById('logoDeviceName').textContent = deviceName;
                    } catch (_) {}
                    // Persist this server (with its name) to the saved-servers list the
                    // first time we see it online
                    if (url !== _lastRegisteredServer) {
                        _lastRegisteredServer = url;
                        _cachedPiConfig = null;
                        document.getElementById('logoDeviceModel').textContent = '';
                        fetchPiConfig();
                        fetch('/api/servers', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ url, name: deviceName })
                        }).then(() => loadSavedServers()).catch(() => {});
                    }

                    // Check the API key state. If we don't have it cached, verify it once.
                    if (isApiKeyValid === null) {
                        await verifyApiKeyDirectly(url, key);
                    }

                    if (isApiKeyValid === true) {
                        indicator.className = 'logo-indicator status-online';
                        indicator.title = 'API Status: Online';
                    } else if (isApiKeyValid === 'disabled') {
                        indicator.className = 'logo-indicator status-offline';
                        indicator.title = 'API Status: REST API Disabled';
                    } else {
                        indicator.className = 'logo-indicator status-invalid-key';
                        indicator.title = 'API Status: Invalid API Key';
                    }
                } else {
                    indicator.className = 'logo-indicator status-offline';
                    indicator.title = 'API Status: Server Error';
                }
            } catch (e) {
                indicator.className = 'logo-indicator status-offline';
                indicator.title = 'API Status: Connection Offline';
            }
        }

        // Proxy agent requests through backend to relay headers and handle cross-origin browser requests
        function piApiFetch(url, options = {}) {
            return fetch(`/api/proxy/url?url=${encodeURIComponent(url)}`, options);
        }

        // Assemble full URL from separate host + port inputs
        function updateAgentAddress() {
            const host = document.getElementById('apiHostInput').value.trim();
            const label = document.getElementById('agentAddress');
            label.textContent = host ? getApiUrl().replace(/^https?:\/\//, '') : 'Select agent';
            label.title = label.textContent;
        }

        function updateSendButtonState() {
            updateAgentAddress();
            const btn = document.getElementById('sendRequestBtn');
            if (!btn) return;
            btn.disabled = !document.getElementById('apiHostInput').value.trim();
        }

        function getApiUrl() {
            const host = (document.getElementById('apiHostInput').value || 'http://localhost').replace(/\/$/, '').trim();
            const port = document.getElementById('apiPortInput').value.trim();
            return port ? `${host}:${port}` : host;
        }

        let _saveConfigTimer = null;

        async function saveConnectionConfig() {
            const host = document.getElementById('apiHostInput').value.trim();
            const port = document.getElementById('apiPortInput').value.trim();
            try {
                await fetch('/api/save-config', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ api_host: host, api_port: port })
                });
            } catch (e) {
                console.warn('Could not save connection config:', e);
            }
        }

        // If the resolved host:port matches a saved record, switch the key field to
        // that Pi's own stored key - each agent keeps a separate secret, never a
        // shared global one. Hosts with no saved record are left untouched so the
        // user can type+save a fresh key for them.
        function applySavedKeyForCurrentHost() {
            const known = (_savedServersCache || []).find(s => s.url === getApiUrl());
            if (known) document.getElementById('apiKeyInput').value = known.api_key ?? '';
        }

        // When base address or key changes in top bar
        let _connectionRevision = 0;

        function onApiConfigChange() {
            _connectionRevision++;
            isApiKeyValid = null;
            _cachedPiConfig = null;
            applySavedKeyForCurrentHost();
            updateApiKeyTooltip();
            updateLiveUrlPreview();
            updateSendButtonState();
            checkApiStatus();
            clearTimeout(_saveConfigTimer);
            _saveConfigTimer = setTimeout(saveConnectionConfig, 600);
            const fullUrl = getApiUrl();
            if (fullUrl) localStorage.setItem('lastServerUrl', fullUrl);
        }

        /* ---------------- PAGE 2: LOG VIEWER SCRIPTS ---------------- */

        // Retrieve logs and output to terminal screen
        async function fetchLogs() {
            // Do not run when not in viewer mode
            const logTab = document.querySelector('[data-tab="logPane"]');
            if (!logTab || !logTab.classList.contains('active')) {
                return;
            }

            const q = document.getElementById('logSearchInput').value.trim();

            const baseUrl = getApiUrl();
            const apiKey = document.getElementById('apiKeyInput').value.trim();

            try {
                const response = await piApiFetch(`${baseUrl}/logs`, { headers: { 'Api-Key': apiKey } });
                if (!response.ok) throw new Error("API call error");

                let logs = (await response.json()).logs || [];
                logs = logs.filter(l => !l.includes('GET /logs'));
                if (q) logs = logs.filter(l => l.toLowerCase().includes(q.toLowerCase()));
                renderLogLines(logs);
            } catch (err) {
                console.error("Failed to read remote logs: ", err);
            }
        }

        // Print lines to HTML
        function renderLogLines(lines) {
            const screen = document.getElementById('logTerminalScreen');
            const emptyState = document.getElementById('logsEmptyState');
            const linesCount = document.getElementById('logLinesCount');

            linesCount.innerText = lines.length;

            if (lines.length === 0) {
                emptyState.style.display = 'flex';
                // Clear out everything except empty state
                const children = Array.from(screen.children);
                children.forEach(c => {
                    if (c.id !== 'logsEmptyState') screen.removeChild(c);
                });
                return;
            }

            emptyState.style.display = 'none';

            // Gather and format lines
            let htmlContent = '';
            lines.forEach(line => {
                let formatted = line;

                // Color Code brackets
                if (line.includes('[API]')) {
                    formatted = line.replace('[API]', '<span class="log-tag-api">[API]</span>');
                } else if (line.includes('[GPIO]')) {
                    formatted = line.replace('[GPIO]', '<span class="log-tag-gpio">[GPIO]</span>');
                }

                formatted = formatted.replace(/\[webhook\]|\[webhock\]/gi,
                    tag => `<span class="log-tag-webhook">${tag}</span>`);

                htmlContent += `<div class="log-line">${formatted}</div>`;
            });

            // Re-render
            const curScrollTop = screen.scrollTop;
            const curScrollHeight = screen.scrollHeight;
            const curClientHeight = screen.clientHeight;

            // Re-fill terminal HTML
            screen.innerHTML = '<div class="logs-empty-state" id="logsEmptyState" style="display:none"></div>' + htmlContent;

            // Handle Sticky Auto-scroll
            const isAutoScroll = document.getElementById('logAutoScrollToggle').checked;
            if (isAutoScroll) {
                screen.scrollTop = screen.scrollHeight;
            }
        }

        // Clear terminal visual screen locally
        function clearConsoleDisplay() {
            const screen = document.getElementById('logTerminalScreen');
            screen.innerHTML = `<div class="logs-empty-state" id="logsEmptyState" style="display:none"></div><div style="color:var(--text-dark); font-style:italic; font-size:0.8rem; padding:8px;">Console display cleared locally. Waiting for new lines...</div>`;
            document.getElementById('logLinesCount').innerText = '0';
        }

        // Clear Server log file
        async function clearLogsOnServer() {
            const confirmReset = confirm("Are you sure you want to completely erase the server-side agent.log file?");
            if (!confirmReset) return;

            // The Pi has no dedicated clear endpoint - drive it the same way log_days=0
            // does: read the current value, zero it (truncates immediately), then restore
            // it. Done client-side via piApiFetch against the currently selected Pi
            // (getApiUrl()/apiKeyInput), not whatever Pi the monitor defaults to.
            const url = getApiUrl();
            const apiKey = document.getElementById('apiKeyInput').value.trim();
            const headers = { 'Content-Type': 'application/json', 'Api-Key': apiKey };

            try {
                const readResp = await piApiFetch(`${url}/config/read`, { headers: { 'Api-Key': apiKey } });
                if (!readResp.ok) throw new Error('Could not read config');
                const config = await readResp.json();
                const previousLogDays = (config.settings || {}).log_days ?? 3;

                const clearResp = await piApiFetch(`${url}/config/update`, {
                    method: 'POST', headers, body: JSON.stringify({ log_days: 0 })
                });
                if (!clearResp.ok) throw new Error('Could not clear log');

                await piApiFetch(`${url}/config/update`, {
                    method: 'POST', headers, body: JSON.stringify({ log_days: previousLogDays })
                });

                clearConsoleDisplay();
                fetchLogs();
            } catch (e) {
                console.error(e);
                alert("Failed to truncate logs file.");
            }
        }

        // Setup focus transition listeners for the cards
        function setupFocusTransitions() {
            document.querySelectorAll('.workbench-body').forEach(body => {
                const reqCard = body.querySelector('.request-card');
                const respCard = body.querySelector('.response-card');
                if (reqCard && respCard) {
                    reqCard.addEventListener('focusin', () => {
                        body.classList.remove('focus-response');

        /* ---------------- SAVED SERVERS DROPDOWN ---------------- */

        // Cache of {url, api_key} records from /api/servers - lets the dropdown and
        // host-change handlers look up a Pi's own saved key without refetching.
        let _savedServersCache = [];
        const _agentModels = new Map();
        let _loadingAgentModels = false;

        async function loadAgentModels() {
            if (_loadingAgentModels) return;
            _loadingAgentModels = true;
            try {
                const missing = _savedServersCache.filter(server => !_agentModels.has(server.url));
                // Bound concurrency so small boards are not overwhelmed.
                for (let i = 0; i < missing.length; i += 4) {
                    await Promise.all(missing.slice(i, i + 4).map(async server => {
                        try {
                            const response = await piApiFetch(`${server.url}/config/read`, {
                                headers: { 'Api-Key': server.api_key || '' },
                                signal: AbortSignal.timeout(2500)
                            });
                            if (!response.ok) return;
                            const config = await response.json();
                            const model = config.agent?.platform;
                            if (typeof model === 'string' && model.trim()) {
                                _agentModels.set(server.url, model.trim());
                                renderServersDropdown(_savedServersCache);
                            }
                        } catch { /* Offline or unauthorized: keep the agent selectable. */ }
                    }));
                }
            } finally {
                _loadingAgentModels = false;
            }
        }

        function renderServersDropdown(servers) {
            const panel = document.getElementById('savedServersPanel');
            if (!panel) return;
            // Sort by agent name (case-insensitive), falling back to the URL when unnamed.
            const sorted = [...servers].sort((a, b) =>
                (a.name || a.url).localeCompare(b.name || b.url, undefined, { sensitivity: 'base' }));
            panel.innerHTML = '';
            if (!sorted.length) panel.innerHTML = '<div class="servers-dd-empty">No saved agents. Use + to add one.</div>';
            sorted.forEach(server => {
                const item = document.createElement('button');
                item.type = 'button';
                item.className = 'servers-dd-item';
                const m = _agentModels.get(server.url);
                const modelText = m ? ` <span style="font-family:'Inter',sans-serif;font-size:0.95rem;font-weight:500;color:var(--text-muted);position:relative;top:1px">- ${m}</span>` : '';
                item.innerHTML = `<span style="font-family:'Inter',sans-serif;font-size:1rem;font-weight:700">${server.name || 'Unnamed agent'}</span>${modelText} <span style="font-family:'Inter',sans-serif;font-size:0.95rem;font-weight:500;color:#9ca3af;position:relative;top:1px">${server.url.replace(/^https?:\/\//, '')}</span>`;
                item.onclick = () => pickSavedServer(server.url);
                panel.appendChild(item);
            });
        }

        // Pass `servers` to render a specific (e.g. scan-filtered) list without
        // touching the underlying persisted set; omit it to load everything saved.
        async function loadSavedServers(servers) {
            try {
                if (!servers) {
                    const res = await fetch('/api/servers');
                    if (!res.ok) return;
                    const data = await res.json();
                    servers = data.servers || [];
                    _savedServersCache = servers;
                } else {
                    _savedServersCache = servers;
                }
                renderServersDropdown(servers);
            } catch (e) {
                console.warn('Could not load saved servers:', e);
            }
        }

        function toggleServersDropdown(e) {
            e.stopPropagation();
            const panel = document.getElementById('savedServersPanel');
            if (!panel) return;
            panel.classList.toggle('open');
            if (panel.classList.contains('open')) loadAgentModels();
            document.getElementById('agentPickerBtn').setAttribute('aria-expanded', String(panel.classList.contains('open')));
        }

        function pickSavedServer(url) {
            document.getElementById('savedServersPanel').classList.remove('open');
            document.getElementById('agentPickerBtn').setAttribute('aria-expanded', 'false');
            selectScannedHost(url);
        }

        let _apiKeyOriginalValue = null;

        function _activeKeyInput() {
            return document.getElementById('apiKeyInput');
        }

        function toggleApiKeyPanel(e) {
            if (e) e.stopPropagation();
            const dialog = document.getElementById('apiKeyDialog');
            if (!dialog) return;
            if (dialog.open) {
                closeApiKeyPanel(true);
                return;
            }
            const input = _activeKeyInput();
            _apiKeyOriginalValue = input.value;
            dialog.showModal();
            input.focus();
            input.select();
        }

        // Closes the API key popup. When `revert` is true (Cancel, or clicking
        // away), any unsaved edits are discarded and the original value restored.
        function closeApiKeyPanel(revert) {
            const dialog = document.getElementById('apiKeyDialog');
            if (!dialog || !dialog.open) return;
            if (revert && _apiKeyOriginalValue !== null) {
                _activeKeyInput().value = _apiKeyOriginalValue;
            }
            dialog.close();
        }

        function saveApiKey() {
            closeApiKeyPanel(false);
            const url = getApiUrl();
            const key = document.getElementById('apiKeyInput').value;
            // Update the in-memory cache immediately so a stale lookup in
            // onApiConfigChange (below) can't clobber this with the old value.
            const rec = (_savedServersCache || []).find(s => s.url === url);
            if (rec) { rec.api_key = key; } else { _savedServersCache.push({ url, api_key: key }); }
            updateApiKeyTooltip();
            fetch('/api/servers', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url, api_key: key })
            }).then(() => loadSavedServers()).catch(() => {});
            onApiConfigChange();
        }

        function cancelApiKeyEdit() {
            closeApiKeyPanel(true);
        }

        // Sends a new API key to the Pi (authenticated with the CURRENT key), and only
        // switches the monitor over to the new key once the Pi confirms the change.
        async function updateApiKeyDangerZone() {
            const input = document.getElementById('dangerZoneNewApiKey');
            const result = document.getElementById('dangerZoneResult');
            const btn = document.getElementById('dangerZoneUpdateBtn');
            const newKey = input.value.trim();

            const setResult = (text, cls) => {
                result.textContent = text;
                result.className = `danger-zone-result ${cls || ''}`.trim();
            };

            if (!newKey) {
                setResult('Enter a new API key first.', 'error');
                input.focus();
                return;
            }

            const url = getApiUrl();
            const currentKey = document.getElementById('apiKeyInput').value;

            btn.disabled = true;
            setResult('Sending update to the Pi…');
            try {
                const response = await piApiFetch(`${url}/config/update`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Api-Key': currentKey
                    },
                    body: JSON.stringify({ api_key: newKey })
                });

                if (!response.ok) {
                    const text = await response.text().catch(() => '');
                    setResult(`Pi rejected the update (HTTP ${response.status}). Key was NOT changed. ${text.slice(0, 200)}`, 'error');
                    return;
                }

                // Pi accepted the new key - switch the monitor over to it.
                document.getElementById('apiKeyInput').value = newKey;
                input.value = '';
                updateApiKeyTooltip();
                onApiConfigChange();
                setResult('✓ Key updated on the Pi. The monitor is now using the new key.', 'success');
            } catch (e) {
                setResult(`Request failed - Key was NOT changed: ${e.message}`, 'error');
            } finally {
                btn.disabled = false;
            }
        }

        // Keeps the key icon's tooltip in sync with the active (saved) key value.
        function updateApiKeyTooltip() {
            const input = _activeKeyInput();
            const btn = document.getElementById('apiKeyBtn');
            if (input && btn) btn.title = `API Key: ${input.value || '(none set)'}`;
        }

        document.addEventListener('keydown', event => {
            if (event.key === 'Escape') {
                document.getElementById('savedServersPanel').classList.remove('open');
                document.getElementById('agentPickerBtn').setAttribute('aria-expanded', 'false');
            }
        });

        document.addEventListener('click', () => {
            const panel = document.getElementById('savedServersPanel');
            if (panel) panel.classList.remove('open');
            document.getElementById('agentPickerBtn').setAttribute('aria-expanded', 'false');
        });

        function openAddAgentDialog() {
            const hostInput = document.getElementById('newAgentHost');
            hostInput.value = _localNetworkPrefix;
            document.getElementById('newAgentPort').value = '8314';
            document.getElementById('newAgentKey').value = 'your-secret-key';
            document.getElementById('addAgentError').textContent = '';
            document.getElementById('addAgentDialog').showModal();
            hostInput.focus();
            hostInput.setSelectionRange(hostInput.value.length, hostInput.value.length);
        }

        function newAgentUrl(host, port) {
            host = host.trim();
            if (/^\d{1,3}\.\d{1,3}\.\d{1,3}\.$/.test(host)) throw new Error('Enter the last number of the IP address.');
            if (!host || /[\s/?#@]/.test(host)) throw new Error('Enter an IP address or hostname without a URL path.');
            if (!/^\d+$/.test(port) || Number(port) < 1 || Number(port) > 65535) throw new Error('Enter a port from 1 to 65535.');
            if (host.includes(':') && !host.startsWith('[')) host = `[${host}]`;
            try {
                const parsed = new URL(`http://${host}:${port}`);
                return `http://${parsed.hostname}:${Number(port)}`;
            } catch { throw new Error('Enter a valid IP address or hostname.'); }
        }

        async function saveNewAgent() {
            const button = document.getElementById('addAgentSubmit');
            const cancel = document.getElementById('addAgentCancel');
            const error = document.getElementById('addAgentError');
            if (button.disabled) return;
            error.textContent = '';
            try {
                const url = newAgentUrl(document.getElementById('newAgentHost').value, document.getElementById('newAgentPort').value);
                const api_key = document.getElementById('newAgentKey').value;
                button.disabled = cancel.disabled = true;
                button.textContent = 'Saving…';

                try {
                    const health = await piApiFetch(`${url}/hello`, { signal: AbortSignal.timeout(2000) });
                    if (!health.ok) throw new Error('Unreachable');
                } catch (e) {
                    throw new Error('Agent unreachable. Please check the address and port and try again.');
                }

                if (api_key) {
                    try {
                        const keyCheck = await piApiFetch(`${url}/config/read`, {
                            headers: { 'Api-Key': api_key },
                            signal: AbortSignal.timeout(2000)
                        });
                        if (keyCheck.status === 401 || keyCheck.status === 403) throw new Error('Wrong API key. Please re-enter and try again.');
                        if (!keyCheck.ok) throw new Error('Could not verify the API key. Please try again.');
                    } catch (e) {
                        if (e.message.startsWith('Wrong')) throw e;
                        throw new Error('Could not verify the API key. Please try again.');
                    }
                }

                const response = await fetch('/api/servers', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url, api_key })
                });
                if (!response.ok) throw new Error('Could not save the agent. Please try again.');
                const data = await response.json();
                await loadSavedServers();
                document.getElementById('addAgentDialog').close();
                document.getElementById('newAgentKey').value = '';
                selectScannedHost(url);
            } catch (err) {
                error.textContent = err.message;
            } finally {
                button.disabled = cancel.disabled = false;
                button.textContent = 'Save & select';
            }
        }

        /* ---------------- NETWORK SCAN SCRIPTS ---------------- */

        function openScanModal() {
            document.getElementById('scanModal').classList.add('open');
            runNetworkScan();
        }

        function closeScanModal() {
            document.getElementById('scanModal').classList.remove('open');
        }

        function setAgentConnection(url) {
            try {
                const parsed = new URL(url);
                document.getElementById('apiHostInput').value = `${parsed.protocol}//${parsed.hostname}`;
                if (parsed.port) document.getElementById('apiPortInput').value = parsed.port;
            } catch (e) {
                document.getElementById('apiHostInput').value = url;
            }
            onApiConfigChange();
        }

        function selectScannedHost(url) {
            setAgentConnection(url);
            closeScanModal();
            // On the Logs tab, stay put and reload the new agent's log instead of
            // jumping away; otherwise land on the agent's hello endpoint and run it
            // (whether chosen from the URL dropdown, a scan result, or the initial auto-pick).
            const activeTab = document.querySelector('.tab-link.active')?.dataset.tab;
            if (activeTab === 'logPane') {
                fetchLogs();
            } else {
                switchTab('testerPane');
                selectEndpoint('hello', true);
            }
        }

        async function readScanResponse(response, onAgent) {
            if (!response.headers?.get('content-type')?.includes('application/x-ndjson')) return response.json();
            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            let buffer = '', result;
            const consume = line => {
                if (!line.trim()) return;
                const event = JSON.parse(line);
                if (event.type === 'agent') onAgent(event.agent);
                if (event.type === 'done') result = event;
                if (event.type === 'error') throw new Error(event.error);
            };
            try {
                while (true) {
                    const { value, done } = await reader.read();
                    buffer += decoder.decode(value, { stream: !done });
                    let newline;
                    while ((newline = buffer.indexOf('\n')) >= 0) {
                        consume(buffer.slice(0, newline));
                        buffer = buffer.slice(newline + 1);
                    }
                    if (done) break;
                }
                consume(buffer);
                if (!result) throw new Error('Scan ended before completion.');
                return result;
            } finally { reader.releaseLock(); }
        }

        let _scanInProgress = false;
        // Startup selects the first response; later responses only update the choices.
        async function runNetworkScan(autoPickFirst = false, onFirst = () => {}) {
            if (_scanInProgress) return;
            _scanInProgress = true;
            const revision = _connectionRevision;
            let selectedFirst = false;
            const acceptAgent = agent => {
                if (!_savedServersCache.some(server => server.url === agent.url)) _savedServersCache.push(agent);
                renderServersDropdown(_savedServersCache);
                if (autoPickFirst && !selectedFirst) {
                    selectedFirst = true;
                    if (_connectionRevision === revision) setAgentConnection(agent.url);
                    onFirst();
                }
            };
            const statusEl = document.getElementById('scanStatusLine');
            const progressFill = document.getElementById('scanProgressFill');
            const resultsList = document.getElementById('scanResultsList');
            const scanBtn = document.getElementById('scanNetworkBtn');

            // Read port directly from the dedicated port input
            const port = parseInt(document.getElementById('apiPortInput').value.trim()) || 8314;

            // Reset UI
            statusEl.textContent = `Scanning local network on port ${port}...`;
            resultsList.innerHTML = '';
            progressFill.style.transition = 'none';
            progressFill.style.width = '0%';
            if (scanBtn) scanBtn.classList.add('scanning');

            // Simulate filling the progress bar over ~8s while waiting for the backend scan
            let simPct = 0;
            const progressTimer = setInterval(() => {
                simPct = Math.min(simPct + 1.1, 90);
                progressFill.style.transition = 'width 0.12s linear';
                progressFill.style.width = simPct + '%';
            }, 100);

            try {
                const res = await fetch(`/api/scan?port=${port}${autoPickFirst ? "&stream=1" : ""}`);
                if (!res.ok) throw new Error(`Server error: ${res.status}`);
                const data = await readScanResponse(res, acceptAgent);
                clearInterval(progressTimer);

                progressFill.style.transition = 'width 0.3s ease';
                progressFill.style.width = '100%';

                const found = data.found || [];
                const subnetPrefix = (data.subnet || '').match(/^(\d{1,3}\.\d{1,3}\.\d{1,3}\.)/);
                if (subnetPrefix) _localNetworkPrefix = subnetPrefix[1];
                const names = data.names || {};   // url -> agent name from /hello
                const label = u => names[u] ? `${names[u]} - ${u}` : u;
                // First agent by name (case-insensitive), used for the auto-pick and to
                // order the results list consistently with the URL dropdown.
                const byName = [...found].sort((a, b) =>
                    (names[a] || a).localeCompare(names[b] || b, undefined, { sensitivity: 'base' }));
                statusEl.textContent = `Scanned ${data.subnet} - ${found.length} server${found.length !== 1 ? 's' : ''} found`;
                // Keep manually added agents available even when a LAN sweep misses them.
                await loadSavedServers();
                if (found.length === 0 && autoPickFirst && !selectedFirst && _connectionRevision === revision) {
                    document.getElementById('apiHostInput').value = '';
                    onApiConfigChange();
                }

                if (found.length === 0) {
                    resultsList.innerHTML = `<div class="scan-empty-state">No ctrlPi servers found on this network.</div>`;
                } else if (autoPickFirst) {
                    // Compatibility with a server that still returns a single JSON response.
                    if (!selectedFirst) acceptAgent(_savedServersCache.find(server => server.url === found[0]) || { url: found[0], name: names[found[0]], api_key: 'your-secret-key' });
                } else if (found.length === 1) {
                    statusEl.textContent = `Found 1 server - auto-selecting...`;
                    resultsList.innerHTML = `<div class="scan-result-item" style="cursor:default"><span class="scan-result-url">${label(found[0])}</span><span class="scan-result-badge"><svg width="8" height="8" viewBox="0 0 8 8"><circle cx="4" cy="4" r="4" fill="currentColor"/></svg>Online</span></div>`;
                    setTimeout(() => selectScannedHost(found[0]), 900);
                } else {
                    byName.forEach(url => {
                        const item = document.createElement('div');
                        item.className = 'scan-result-item';
                        item.innerHTML = `<span class="scan-result-url">${label(url)}</span><span class="scan-result-badge"><svg width="8" height="8" viewBox="0 0 8 8"><circle cx="4" cy="4" r="4" fill="currentColor"/></svg>Online</span>`;
                        item.onclick = () => selectScannedHost(url);
                        resultsList.appendChild(item);
                    });
                }
            } catch (err) {
                clearInterval(progressTimer);
                progressFill.style.transition = 'none';
                progressFill.style.width = '0%';
                statusEl.textContent = 'Scan failed.';
                resultsList.innerHTML = `<div class="scan-empty-state" style="color:var(--danger)">Error: ${err.message}</div>`;
            } finally {
                _scanInProgress = false;
                if (scanBtn) scanBtn.classList.remove('scanning');
            }
        }

    </script>
