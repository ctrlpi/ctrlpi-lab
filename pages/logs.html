        <div id="logPane" class="pane">

            <!-- Controls toolbar -->
            <div class="log-toolbar">
                <div class="toolbar-left-group">
                    <div class="search-box log-search">
                        <svg viewBox="0 0 24 24">
                            <path
                                d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z" />
                        </svg>
                        <input type="text" id="logSearchInput" placeholder="Search logs..." oninput="fetchLogs()">
                    </div>

                    <div class="log-icon-actions">
                    <!-- Truncate Log File -->
                    <button type="button" class="key-icon-btn" title="Reset log" aria-label="Reset log" onclick="clearLogsOnServer()">
                        <svg aria-hidden="true" viewBox="0 0 24 24">
                            <path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z" />
                        </svg>
                    </button>

                    <!-- Manual Refresh -->
                    <button type="button" class="theme-toggle-btn" title="Refresh logs" aria-label="Refresh logs" onclick="triggerManualLogRefresh()">
                        <svg aria-hidden="true" id="refreshBtnIcon" viewBox="0 0 24 24">
                            <path
                                d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z" />
                        </svg>
                    </button>
                    </div>

                    <div class="log-count-badge">
                        Showing <span id="logLinesCount">0</span> log lines
                    </div>
                </div>

                <div class="toolbar-right-group">

                    <!-- Auto refresh rate -->
                    <div class="refresh-rate-group">
                        <label for="refreshRateSelect">Poll Rate:</label>
                        <select id="refreshRateSelect" class="refresh-rate-select" onchange="setupLogAutoRefresh()">
                            <option value="3000">3s</option>
                            <option value="10000">10s</option>
                            <option value="20000" selected>20s</option>
                            <option value="30000">30s</option>
                            <option value="manual">Manual</option>
                        </select>
                    </div>

                    <!-- Auto Scroll Toggle -->
                    <div class="config-input-group switch-group" style="border:none; padding:0; background:none;">
                        <label for="logAutoScrollToggle" style="margin-right: 6px;">Auto Scroll</label>
                        <label class="toggle-switch">
                            <input type="checkbox" id="logAutoScrollToggle" checked>
                            <span class="slider"></span>
                        </label>
                    </div>

                </div>
            </div>

            <!-- Log Terminal box -->
            <div class="terminal-container">
                <div class="terminal-header">
                    <div class="terminal-dots">
                        <span class="terminal-dot td-red"></span>
                        <span class="terminal-dot td-yellow"></span>
                        <span class="terminal-dot td-green"></span>
                    </div>
                    <div class="terminal-title">GET /logs (polling)</div>
                    <div></div>
                </div>

                <div class="terminal-screen" id="logTerminalScreen">
                    <!-- Dynamic logs outputted here -->
                    <div class="logs-empty-state" id="logsEmptyState">
                        <svg stroke="currentColor" viewBox="0 0 24 24">
                            <path
                                d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                        </svg>
                        <span>No log messages found on the server. Try running some tests!</span>
                    </div>
                </div>
            </div>

        </div>
